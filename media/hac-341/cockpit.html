<!doctype html>
<html lang="en" data-cockpit="HAC-341">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Run — Interlock judge verification cockpit</title>
<!-- The frozen HAC-332 identity: tokens, grammar and the self-hosted Geist
     faces. Relative and local by design — this surface must render identically
     with networking disabled, or a deterministic capture is not deterministic. -->
<!-- Keep the faces owned by the cockpit as well as by the token entry point.
     Some static preview hosts preserve inline CSS but do not follow CSS
     imports. Without these declarations `var(--font-sans)` is unresolved and
     the page falls all the way back to the browser's serif default. The font
     binaries remain the single, repository-local copies under assets/fonts. -->
<link rel="preload" href="../../assets/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../assets/fonts/geist-mono-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/styles.css">
<link rel="icon" href="../../assets/logo/interlock-favicon-light.svg" type="image/svg+xml">
<style>
@font-face{
  font-family:"Geist";
  src:url("../../assets/fonts/geist-variable.woff2") format("woff2");
  font-weight:100 900;
  font-style:normal;
  font-display:block;
}
@font-face{
  font-family:"Geist Mono";
  src:url("../../assets/fonts/geist-mono-variable.woff2") format("woff2");
  font-weight:100 900;
  font-style:normal;
  font-display:block;
}
:root{
  --n00:#fff;--n05:#f7f8f8;--n10:#eef0f0;--n20:#dde0e0;--n30:#c2c7c7;--n40:#9ba2a2;
  --n50:#737b7b;--n60:#515858;--n70:#343a3a;--n80:#1e2323;--n90:#141818;--n95:#0f1212;
  --ink:#0b0d0e;--paper:#fbfbfa;
  /* COUPLED measured 4.01:1 on the sunken light surface at L=0.58, under the
     4.5:1 floor for 8.5-10px label text. L=0.52 measures 5.15:1. Hue and chroma
     are unchanged; the dark peer below is already ~8.6:1 and is left alone. */
  --coupled:oklch(0.52 0.130 250);--blocked:oklch(0.58 0.150 28);
  --executed:oklch(0.52 0.130 300);--observed:oklch(0.60 0.100 205);
  --failed:oklch(0.46 0.170 22);
  /* Surfaces, so a panel reads as an object rather than an outline on a field. */
  --surface-card:#fff;--surface-sunken:#f7f8f8;--border-hair:#dde0e0;--border-default:#c2c7c7;
  /* Resolved from the ported HAC-332 typography tokens, so this surface and the
     storyboard cannot disagree about the family. The faces are vendored; the
     stack after them is a safety net, not the intended rendering. */
  --sans:var(--font-sans, Geist, "Geist Sans", "Helvetica Neue", Helvetica, Arial, sans-serif);
  --mono:var(--font-mono, "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace);
  /* One source for the panel width: the drawer is sized from it and the run
     yields exactly that much space when the panel opens. */
  --drawer-w:min(560px,50vw);
  /* Text hierarchy is carried by colour, never by opacity.
     `opacity` on a label composites it toward whatever is behind it, and it
     multiplies through every ancestor that also sets it — so a 0.6 label inside
     a 0.7 row inside a 0.62 receded stage renders at 0.26 and measured 1.81:1.
     A colour token cannot compound and can be measured once.
     Both tiers are measured against the *sunken* surface, the harder of the two:
       light  --n60 #515858  6.84:1 on sunken, 7.27:1 on card
       dark   --n40 #9ba2a2  6.89:1 on sunken, 7.25:1 on card
     --n50 was the natural next step down and measures 4.07:1 on sunken, under
     the floor, so there is deliberately no third tier. */
  --text-body:var(--ink);
  --text-muted:var(--n60);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.4;overflow-x:hidden}
/* Proof class is the field, exactly as HAC-333 SB-06 established. */
body[data-proof="local"]{background:var(--paper);color:var(--ink)}
body[data-proof="cloud"]{background:var(--ink);color:var(--paper);
  /* The dark peers from tokens/colors.css. The light hues sit at L~0.52-0.60
     and are under-lit on an L~0.10 ground; the design lifts them for this
     field and the executable must too. */
  --coupled:oklch(0.74 0.120 250);--blocked:oklch(0.72 0.150 32);
  --executed:oklch(0.70 0.130 300);--observed:oklch(0.76 0.090 205);
  --failed:oklch(0.64 0.170 25);
  --surface-card:#0f1212;--surface-sunken:#141818;--border-hair:#1e2323;--border-default:#343a3a;
  --text-body:var(--paper);--text-muted:var(--n40)}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{font-weight:500;letter-spacing:-.018em}

/* ── header ── */
/* The cockpit is a bounded, centred object. --width-full (90rem = 1440px) is
   the widest content bound the frozen system declares; past it the field grows,
   not the layout. Without this the numerals float in empty space on a wide
   desktop and the composition reads as a debug panel. */
.frame{max-width:var(--width-full,90rem);margin:0 auto;width:100%}
header{border-bottom:2px solid currentColor;padding:14px 24px 12px;display:flex;
  align-items:center;gap:20px;flex-wrap:wrap}
/* The canonical lockup, at the size TheRun.dc.html specifies (mark 20px).
   The gap and wordmark size are derived from that one number by the frozen
   ratios, never set independently. */
.brand{display:inline-flex;align-items:center;gap:5.8px;color:currentColor}
.brand .mark{display:block;flex:none}
.brand .word{font-family:var(--sans);font-weight:500;font-size:14.2px;
  letter-spacing:-.03em;line-height:1}
/* The gate is drawn closed and stays closed. The open-state transform that
   used to live here was unreachable CSS, and the five-state gate sequence is
   deliberately not used on this surface: it encodes a review-then-open
   progression the frozen packets never emitted. */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);white-space:nowrap}
/* The proof class is what this page is about and the thing that changes when
   you switch, so it outranks the run metadata beside it rather than sharing a
   tier with it. */
.ptitle{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;padding-left:14px;border-left:1px solid var(--border-default);
  white-space:nowrap}
.degraded-head{border-bottom:2px solid currentColor;padding:14px 24px 12px;display:flex;
  align-items:center;gap:14px}
.pin{display:flex;gap:16px;flex:1;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
.pin div{display:flex;flex-direction:column;gap:2px}
.pin .k{font-size:9px;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted)}
.pin .v{font-size:11px;font-weight:600;color:var(--text-body)}
.switch{display:flex;flex-direction:column;gap:3px}
.switch .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--text-muted)}
.switch .btns{display:flex;border:2px solid currentColor;border-radius:3px;overflow:hidden}
.switch button{padding:5px 10px;font-size:10px;font-weight:600;font-family:var(--mono);
  letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
.switch button:hover{background:var(--surface-sunken)}
.switch button[aria-pressed="true"]{background:currentColor}
.switch button[aria-pressed="true"]:hover{background:currentColor}
.arms button:hover,.actions button:hover{background:var(--surface-sunken)}
/* Explicit ink/paper, not currentColor: `background:currentColor` resolves
   against this element's own colour, which these rules have already flipped, so
   the selected class rendered paper-on-paper and vanished. */
body[data-proof="local"] .switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
body[data-proof="cloud"] .switch button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* ── editorial verdict, visibly not evidence ── */
.verdict{padding:8px 24px;display:flex;gap:12px;align-items:baseline;
  border-bottom:1px dashed var(--n40)}
.verdict .tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  border:1px dashed var(--n40);padding:2px 6px;border-radius:2px;color:var(--text-muted);white-space:nowrap}
.verdict p{font-size:15px;font-weight:500;max-width:88ch}

.grid{padding:18px 24px 20px;display:grid;grid-template-columns:1.12fr 1fr;
  gap:0;align-items:start}
.grid>.col:first-child{padding-right:24px;border-right:1px solid var(--border-hair)}
.grid>.col:last-child{padding-left:24px}
.col h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;font-weight:500}
.card{border:1px solid var(--border-default);border-radius:3px;padding:12px 14px;
  background:var(--surface-card)}
.intents{display:flex;gap:10px}
.intents .card{flex:1}
.intents h3{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;
  font-weight:600;letter-spacing:.07em;padding:2px 7px;border:1.5px solid currentColor;
  border-radius:2px;text-transform:uppercase;margin-top:4px}
.chip::before{content:attr(data-glyph);font-weight:700}
.chip[data-s="local"]{color:var(--text-muted);border-style:dashed;border-width:1px}
.chip[data-s="coupled"]{color:var(--coupled);border-style:solid}
.chip[data-s="executed"]{color:var(--executed);border-style:double;border-width:3px}
.chip[data-s="observed"]{color:var(--observed);border-style:dotted}
.chip[data-s="blocked"]{color:var(--blocked);border-style:solid;border-width:2px}

/* ── causal connectors ──
   The relationship used to be carried by nothing but stacking order, so the
   two intents converged on nothing and the decision pointed at no result. The
   stroke patterns come from the frozen edge grammar rather than being invented
   here; the connectors are decorative reinforcement of an order the headings
   and the cause line already state, so they are hidden from assistive tech.
   Drawn as brackets rather than diagonals on purpose: the strip is ~700px wide
   and 26px tall, so `preserveAspectRatio:none` compresses the horizontal axis
   about sevenfold and any diagonal flattens into a near-horizontal line. Right
   angles survive that distortion and still read as convergence. */
.cxn{height:26px;margin-bottom:-1px}
.cxn.short{height:20px}
.cxn svg{display:block;width:100%;height:100%}
.cxn path{fill:none;stroke:currentColor;vector-effect:non-scaling-stroke}
.cxn .e-intent{stroke-width:var(--stroke-1,1.5px);stroke-dasharray:var(--edge-intent-dash,5 4);opacity:.5}
.cxn .e-couple{stroke-width:var(--stroke-2,2px);opacity:.7}

.env{border:2px solid currentColor;border-radius:3px;padding:14px 16px;
  background:var(--surface-card)}
.env .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.env .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--coupled);font-weight:600}
.env[data-coupled="false"] .lbl{color:var(--text-muted)}
.env .bound{font-family:var(--mono);font-size:17px;font-weight:600}
.env .attr{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:5px;line-height:1.4}
.env .attr b{font-weight:600;color:var(--text-body)}

/* ── the perturbation lesson, stated rather than implied ──
   This used to live only in 9px helper copy, so the one fact that makes the
   perturbed arm meaningful — that the evidence itself changed — was the least
   visible thing on the page. */
.delta{border:2px solid currentColor;border-radius:3px;padding:11px 14px;margin-top:12px;
  background:var(--surface-sunken)}
.delta .dl{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;
  border-radius:2px;padding:2px 7px}
.delta .dtext{font-size:12.5px;margin-top:7px;line-height:1.45}
.delta .dchain{display:flex;align-items:baseline;gap:9px;margin-top:8px;flex-wrap:wrap}
.delta .dtok{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em}
.delta .dar{font-size:15px;color:var(--text-muted)}
.delta .dv{font-family:var(--mono);font-size:20px;font-weight:600}
.delta[data-holds="false"] .dv{color:var(--failed)}
.delta .ddetail{font-size:10px;color:var(--text-muted);margin-top:7px;line-height:1.45;overflow-wrap:anywhere}

.decision{margin-top:0;border:1px solid var(--border-default);border-left:3px solid currentColor;
  border-radius:3px;padding:12px 16px;background:var(--surface-card)}
.decision .dk{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--text-muted);
  text-transform:uppercase}
/* The decision is the mechanism; the numerals are the consequence. It used to
   be set at 26px against 32px numerals and, being the widest object on the
   page, read as the headline. */
.decision .tok{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:.01em;
  margin-top:2px}
.decision .why{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:3px}
.decision .frozen{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--text-muted);margin-top:4px}
.decision .outflow{display:flex;align-items:center;gap:7px;margin-top:9px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.decision .outflow .ol{flex:1;border-top:2px solid currentColor}

.results{display:flex;flex-direction:column;gap:8px}
.res{border:1px solid var(--border-default);border-left:3px solid currentColor;
  border-radius:3px;padding:11px 14px;background:var(--surface-card)}
.res .v::before{content:attr(data-glyph) " ";font-weight:500}
.res .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.res .v{font-family:var(--mono);font-size:40px;font-weight:500;line-height:1.06;margin-top:2px}
.res .n{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.res[data-holds="false"]{border-left-color:var(--failed)}
.res[data-holds="false"] .v{color:var(--failed)}
/* Satisfied stays ink. The design's green is the authorization-state hue, which
   would assert a lifecycle this run never emitted, and the observation hue
   belongs to the cloud class; the check glyph and the verdict line carry the
   state instead. */
.res[data-holds="true"]{border-left-color:currentColor}
/* The inbound cause: what produced this number. This is the decision -> outcome
   link, and it is real text rather than a line, so it survives without vision. */
.res .cause{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.res .cause .cxl{width:15px;flex:none;border-top:2px solid currentColor;opacity:.45}
.res .cause .ctok{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-body)}


.arms{display:flex;gap:6px;margin-top:9px}
.arms button{flex:1;border:2px solid currentColor;border-radius:3px;padding:6px 5px;
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.03em}
.arms button[aria-pressed="true"]{background:currentColor}
body[data-proof="local"] .arms button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.armnote{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.45}
.armnote.lead{font-family:var(--sans);font-size:12px;color:var(--text-body)}
.armnote.lead b{font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.actions button{border:2px solid currentColor;border-radius:3px;padding:6px 10px;
  font-size:11.5px;font-weight:600}
/* Demoted while the walk is running: the border thins and the weight drops, so
   the step's own action leads. Text colour is untouched — a demoted control is
   quieter, not less readable, and it keeps its tap target and tab position. */
.actions[data-guide-weight="secondary"] button{border-width:1px;border-color:var(--border-default);
  font-weight:500}
.actions[data-guide-weight="secondary"] button:hover{border-color:currentColor}

/* ── cloud lanes ──
   A spine with a node per hop, and the lane named only where it changes, so the
   recorded sequence reads as one traversed path instead of nine unrelated rows.
   No ordinal is drawn: the lane attribution is what answers "where does Google
   end and Interlock begin", and ordinals were deliberately dropped for it. */
.hops{position:relative;padding-left:19px;display:flex;flex-direction:column;gap:3px}
.hops::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;
  border-left:2px solid var(--border-default);opacity:.6}
.hop{position:relative;display:grid;grid-template-columns:152px 1fr auto;gap:12px;
  align-items:center;border:1px solid var(--border-hair);border-radius:3px;padding:6px 9px}
.hop::before{content:"";position:absolute;left:-17px;top:50%;width:7px;height:7px;
  margin-top:-3.5px;border-radius:50%;background:var(--border-default)}
.hop .n{font-family:var(--mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em;
  text-transform:uppercase;line-height:1.25}
.hop .t{font-size:12.5px;font-weight:500}
.hop .d{font-family:var(--mono);font-size:9.5px;color:var(--text-muted);text-align:right}
.hop[data-lane="new"]{margin-top:5px}
.hops .hop:first-child{margin-top:0}
.hop[data-role="decision"],.hop[data-role="effect"]{border-color:var(--executed);border-width:2px;background:var(--surface-sunken)}
.hop[data-role="observation"]{border-color:var(--observed);border-width:2px;background:var(--surface-sunken)}
.hop[data-role="decision"]::before,.hop[data-role="effect"]::before{background:var(--executed)}
.hop[data-role="observation"]::before{background:var(--observed)}
.notonpath{margin-top:10px;border:1px solid var(--border-default);
  border-left:3px solid var(--blocked);border-radius:3px;padding:8px 12px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em}
.controls{display:flex;gap:6px;margin-top:8px}
.controls .c{flex:1;border:2px solid var(--blocked);border-radius:3px;padding:6px 8px;color:var(--blocked)}
.controls .c .s{font-family:var(--mono);font-size:19px;font-weight:600}
.controls .c .l{font-size:10px;line-height:1.25}
.note{font-size:10.5px;color:var(--text-muted);margin-top:5px}

/* ── drawer (L2/L3) — anchored, causal context stays on screen ── */
.drawer{position:fixed;top:0;right:0;bottom:0;left:auto;max-height:100vh;height:100vh;
  width:var(--drawer-w);margin:0;border:none;border-left:3px solid currentColor;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.3,1);
  overflow-y:auto;padding:18px 22px}
/* No backdrop. L2 explains L1, so L1 must stay lit and readable behind it.
   Closed, the panel is visually and programmatically out of reach. */
.drawer[data-open="false"]{visibility:hidden}
body[data-proof="local"] .drawer{background:var(--n00);color:var(--ink)}
body[data-proof="cloud"] .drawer{background:var(--n95);color:var(--paper)}
.drawer[data-open="true"]{transform:none}
.drawer h2{font-size:17px;margin-bottom:3px}
.drawer .sub{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-bottom:14px}
.drawer section{margin-bottom:15px}
.drawer h3{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-family:var(--mono);font-size:11px}
.kv dt{color:var(--text-muted)}.kv dd{word-break:break-all}
.drawer a{color:var(--coupled);text-decoration:underline;text-underline-offset:2px}
.drawer .close{position:absolute;top:14px;right:18px;font-size:22px;line-height:1;padding:2px 7px;
  border:2px solid currentColor;border-radius:3px}
.unavail{border:2px dashed var(--n40);border-radius:3px;padding:8px 11px;font-size:11.5px}
/* Raw proof is read, so it is not boxed into a fixed 270px window while the
   panel below it sits empty; the panel scrolls and the block shows its content. */
pre{background:rgba(128,128,128,.14);padding:9px;border-radius:3px;font-family:var(--mono);
  font-size:10px;overflow-x:auto;line-height:1.45;white-space:pre}
.copy{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;border:1.5px solid currentColor;border-radius:2px;
  padding:1px 6px;color:var(--text-muted);white-space:nowrap}
.copy:hover{color:var(--text-body);background:var(--surface-sunken)}
.copy[data-copied="true"]{background:var(--text-body);color:var(--surface-card)}
.kv dd .copy{margin-left:8px}
.bnd{display:flex;flex-wrap:wrap;gap:14px}
.bnd>div{flex:1;min-width:190px}
.bnd li{list-style:none;font-size:11.5px;line-height:1.5;padding-left:15px;position:relative}
.bnd .p li::before{content:"+";position:absolute;left:0;color:var(--observed);font-weight:700}
.bnd .n li::before{content:"\2013";position:absolute;left:0;color:var(--blocked);font-weight:700}

/* The panel explains the result, so the result may not be underneath it. The
   run yields exactly the panel's width instead of being covered. */
body[data-drawer="open"] main.frame{max-width:calc(100vw - var(--drawer-w));
  margin-left:0;margin-right:0;transition:max-width .22s cubic-bezier(.2,.7,.3,1)}
/* The run keeps both columns in the space it has left, so nothing needs
   scrolling to stay visible; the numerals step down just far enough not to
   wrap, and still lead the decision token by roughly 2:1. */
body[data-drawer="open"] .res .v{font-size:32px}
body[data-drawer="open"] .hop{grid-template-columns:112px 1fr auto;gap:9px}

/* ── degraded ── */
.degraded{padding:48px 24px;max-width:660px}
.degraded h2{font-size:23px;margin-bottom:9px;max-width:24ch}
.degraded .mono{font-size:12px;color:var(--text-muted);margin-bottom:14px;word-break:break-all}
/* The refusal sentence measured 4.45:1 in --blocked on paper — 0.05 under the
   floor for 12.5px text. The state stays on the stroke channel, where the
   non-text threshold is 3:1 and --blocked clears it comfortably; the sentence
   itself is read in body ink. This is the rule the identity notes already
   state: a redundant stroke channel does not excuse unreadable text. */
.degraded .refused{border:2px solid var(--blocked);color:var(--text-body);border-radius:3px;
  padding:9px 12px;font-size:12.5px;font-weight:600}
.degraded .next{margin-top:18px;border-top:1px solid var(--border-hair);padding-top:14px}
.degraded .next .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:6px}

/* ── reserved HAC-319 surface: labels only, never a mark ── */
.regimes{display:flex;gap:9px;margin-top:8px}
.regimes .r{flex:1;border:2px dashed var(--n40);border-radius:3px;padding:16px 9px;text-align:center}
.regimes .r .t{font-family:var(--mono);font-size:11px;font-weight:600}
.regimes .r .u{font-family:var(--mono);font-size:9px;color:var(--text-muted);margin-top:5px}

/* Below 1280 the columns stack, causal first: side by side they crush and the
   30-second read is the first casualty. The judge gates at 1440x900 and
   1280x800 sit above this and are unaffected. */
@media (max-width:1279px){
  .grid{grid-template-columns:1fr;gap:0}
  .grid>.col:first-child{padding-right:0;border-right:0;
    border-bottom:1px solid var(--border-hair);padding-bottom:18px}
  .grid>.col:last-child{padding-left:0;padding-top:18px}
}
/* With the panel open the run has a column's worth less room, so it stacks for
   the same reason — the causal order survives, the crush does not. */
@media (max-width:1439px){
  body[data-drawer="open"] .grid{grid-template-columns:1fr;gap:0}
  body[data-drawer="open"] .grid>.col:first-child{padding-right:0;border-right:0;
    border-bottom:1px solid var(--border-hair);padding-bottom:18px}
  body[data-drawer="open"] .grid>.col:last-child{padding-left:0;padding-top:18px}
}
/* Below 1024 the anchored panel has no room to sit beside the run, so it takes
   the frame. It stays non-modal: the run is still behind it, not inert. */
@media (max-width:1023px){
  .drawer{width:100%;max-width:none;border-left:0;border-top:3px solid currentColor}
  body[data-drawer="open"] main.frame{max-width:100%}
}
@media (prefers-reduced-motion:reduce){
  .drawer{transition:none!important}
  body[data-drawer="open"] main.frame{transition:none!important}
}
html[data-static="true"] .drawer{transition:none!important}
html[data-static="true"] main.frame{transition:none!important}
/* Arm switching is the one explanatory transition on this surface: the three
   things that change together — evidence, decision, outcome — are stepped in
   together so the reader sees which parts moved. Keyframes and durations come
   from the frozen motion tokens, which also zero themselves and hard-stop
   [data-il-motion] under prefers-reduced-motion. It plays once and settles. */
[data-il-motion="arm"]{animation:il-step-in var(--dur-base,220ms) var(--ease-standard) both}
.env[data-il-motion="arm"]{animation-delay:0ms}
.delta[data-il-motion="arm"],.decision[data-il-motion="arm"]{animation-delay:var(--delay-step,90ms)}
.results[data-il-motion="arm"]{animation-delay:calc(var(--delay-step,90ms) * 2)}
html[data-static="true"] [data-il-motion]{animation:none!important}
/* The resolved reduced-motion state — OS preference or the manual control —
   substitutes immediate state changes for staged ones. It is applied as its own
   attribute rather than reusing ?static=1 so the two stay independently
   observable, and it never removes a step, a marker or a line of copy. */
html[data-reduced-motion="true"] [data-il-motion]{animation:none!important}
html[data-reduced-motion="true"] .drawer{transition:none!important}
html[data-reduced-motion="true"] main.frame{transition:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── refined evidence-review composition ────────────────────────────────
   The rail is the page's signature: independent intents visibly converge on
   frozen evidence, which owns the decision and the result. Cards support the
   chain; they do not become the visual language themselves. */
body[data-proof="local"]{background:var(--n10)}
body[data-proof="cloud"]{background:var(--n95)}
.frame{max-width:var(--width-wide,76rem);background:var(--paper);min-height:100vh}
body[data-proof="cloud"] .frame{background:var(--ink)}
.run-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;padding:16px 24px 12px}
.run-header__identity{display:flex;align-items:center;gap:14px;min-width:0;overflow-x:auto}
.run-header__identity .eyebrow{border-right:1px solid var(--border-default);padding-right:14px}
.run-header__facts{grid-column:1/-1;gap:20px;padding-top:8px;border-top:1px solid var(--border-hair);font-size:10px}
.run-header__facts .k{font-size:8.5px}.run-header__facts .v{font-size:10px}
.run-header .switch{justify-self:end}
.run-thesis{padding:8px 24px;background:var(--surface-sunken);border-bottom:1px solid var(--border-hair);align-items:flex-start}
.run-thesis .tag{margin-top:2px}.run-thesis p{max-width:72ch;font-size:15px;line-height:1.45}
.causal-layout{padding:16px 24px 18px;display:grid;gap:0}
.stage-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:baseline;margin-bottom:10px;font-family:var(--mono);text-transform:uppercase}
.stage-head h2{font-size:10px;font-weight:600;letter-spacing:.12em;overflow-x:auto}.stage-head>span:last-child{font-size:8.5px;letter-spacing:.1em;color:var(--text-muted)}
.stage-no{font-size:10px;color:var(--coupled);font-weight:600;letter-spacing:.04em}
.causal-stage{max-width:44rem}
.intents{gap:12px}.intent-card{display:grid;gap:5px;padding:10px 14px;min-height:78px}
.intent-card .intent-id{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--text-muted)}
.intent-card h3{font-size:15px;line-height:1.15}.intent-card .chip{justify-self:start;margin:0}
.causal-stage .cxn{width:calc(100% - 48px);margin-left:24px;height:22px}
.evidence-band{position:relative;max-width:58rem;padding:0;margin-top:-1px;border-left-width:3px;background:var(--surface-sunken)}
.evidence-band::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--grid-fine);opacity:var(--grid-fine-opacity)}
.evidence-band .stage-head,.evidence-band .env__body,.evidence-band .delta{position:relative}
.evidence-band .stage-head{padding:9px 16px 0;margin-bottom:6px}.evidence-band .env__body{padding:0 16px 10px}
.evidence-band .attr{max-width:70ch}.evidence-ledger{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:7px;padding-top:7px;border-top:1px solid var(--border-default);font-family:var(--mono);font-size:9px;line-height:1.45;color:var(--text-muted)}
.evidence-ledger b{text-transform:uppercase;letter-spacing:.09em;font-size:8px;color:var(--text-muted)}.evidence-band .delta{margin:0;border-width:1px;border-left:0;border-right:0;border-bottom:0;border-radius:0;padding:10px 16px}
.evidence-band .delta .dtext{max-width:76ch}.causal-drop{width:2px;height:24px;margin:0 0 0 28px}.causal-drop svg{width:2px}
.resolution-grid{display:grid;grid-template-columns:minmax(17rem,.85fr) minmax(22rem,1.15fr);gap:18px;align-items:stretch}
.decision-bar{display:flex;flex-direction:column;margin:0;border-left-width:3px;padding:14px 16px;background:var(--surface-card)}
.decision-bar .stage-head{margin-bottom:16px}.decision-bar .tok{font-size:clamp(20px,2.1vw,28px);line-height:1.05}.decision-bar .why{margin-top:8px;line-height:1.45}.decision__body{margin-top:auto}
.outcome-stage{border-left:1px solid var(--border-hair);padding-left:18px}.outcome-stage .stage-head{margin-bottom:8px}
.results{gap:8px}.res{padding:11px 14px;transition:border-color var(--dur-base,220ms) var(--ease-standard)}
.res[data-selected="false"]{background:var(--surface-sunken);color:var(--text-muted)}.res[data-selected="false"] .v{font-size:28px}
.res[data-selected="true"]{border-width:2px;border-left-width:4px;padding:12px 16px;box-shadow:var(--elev-1)}
.res[data-selected="true"] .v{font-size:clamp(38px,3.7vw,48px)}.res[data-selected="true"] .k{color:var(--text-muted)}
.arm-switcher{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border-hair)}
.arm-switcher .arms{margin:0}.arm-switcher .armnote{grid-column:1/-1;margin:0}.arm-switcher .actions{margin:0;justify-self:end}.arms button{min-height:var(--tap-target,44px);padding:7px 9px}.actions button{min-height:var(--tap-target,44px)}
.proof-source{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--text-muted);margin:-1px 0 7px;overflow-wrap:anywhere}
/* The code surface follows its field.
   `--surface-code` is #f7f8f8 — a light surface — and it was applied in both
   proof classes. In the cloud class the drawer sets `color:var(--paper)`, so the
   raw packet rendered as paper text on a near-white block and measured 1.03:1:
   the L3 proof was there and could not be read. The spans carry Shiki's
   `--shiki-light`/`--shiki-dark` pair but nothing consumes them, so neither
   class shows syntax colour today; that is a separate question from whether the
   text is legible, and only the legibility is fixed here. */
body[data-proof="cloud"] pre.shiki-proof{background:var(--n95);border-color:var(--border-default)}
body[data-proof="cloud"] pre.shiki-proof pre{background:transparent}
pre.shiki-proof{padding:0;background:var(--surface-code);border:1px solid var(--border-default);font-size:10px;line-height:1.55;white-space:pre;overflow:auto}
pre.shiki-proof code{display:block;padding:12px 14px;font-family:var(--mono);overflow-x:auto}
pre.shiki-proof .line{min-height:1.55em}
@media (min-width:901px){
  .run-header{padding-top:13px;padding-bottom:10px}.run-header__facts{padding-top:6px}
  .causal-layout{padding-top:13px;padding-bottom:12px}.intent-card{min-height:70px}
  .causal-stage .cxn{height:18px}.causal-drop{height:19px}
  .arm-switcher{margin-top:8px;padding-top:8px}
}
/* The first desktop read has a compact, explicit contract: identity, causal
   chain, recorded comparison and verification controls all fit in an 800px
   high browser with breathing room. This is density only; no evidence is
   removed or hidden. Taller viewports retain the more generous review rhythm. */
@media (min-width:901px) and (max-height:900px){
  .run-header{padding-top:10px;padding-bottom:8px;gap:6px 20px}.run-header__facts{padding-top:5px;gap:15px}
  .run-thesis{padding-top:5px;padding-bottom:5px}.run-thesis p{font-size:13px;line-height:1.3}
  .causal-layout{padding-top:10px;padding-bottom:12px}.stage-head{margin-bottom:6px}
  .intent-card{min-height:60px;gap:3px;padding:7px 11px}.intent-card h3{font-size:13px}.intent-card .intent-id{font-size:8px}
  .chip{font-size:8.5px;padding:1px 5px}.causal-stage .cxn{height:14px}
  .evidence-band .stage-head{padding-top:6px;margin-bottom:3px}.evidence-band .env__body{padding-bottom:6px}
  .env .attr{margin-top:3px;line-height:1.25}.evidence-ledger{margin-top:4px;padding-top:4px}
  .causal-drop{height:14px}.decision-bar{padding:9px 12px}.decision-bar .stage-head{margin-bottom:8px}
  .decision-bar .tok{font-size:20px}.decision-bar .why{margin-top:4px}.decision-bar .frozen{margin-top:2px}
  .outcome-stage .stage-head{margin-bottom:5px}.results{gap:5px}.res{padding:7px 10px}.res .cause{margin-bottom:2px}
  .res[data-selected="false"] .v{font-size:22px}.res[data-selected="true"]{padding:8px 12px}.res[data-selected="true"] .v{font-size:34px}
  .res .n{font-size:10px;margin-top:1px}.arm-switcher{margin-top:7px;padding-top:7px;gap:4px 14px}
  .arms button,.actions button{min-height:36px}.arms button{padding:4px 7px}.actions button{padding:4px 8px;font-size:10.5px}
  .armnote{font-size:9px;line-height:1.25}
  /* On the ablation step the changed-evidence block and the markers say the
     same thing twice; the block keeps its full text and gives back the leading,
     so the outcome it explains stays in the first frame. */
  .evidence-band .delta{padding:6px 16px}.delta .dl{font-size:9px}
  .delta .dtext{font-size:11.5px;margin-top:4px;line-height:1.3}
  .delta .dchain{margin-top:5px}.delta .dv{font-size:17px}.delta .dtok{font-size:12px}
  .delta .ddetail{margin-top:4px;line-height:1.3}
}
@media (max-width:900px){
  .run-header{grid-template-columns:1fr}.run-header .switch{justify-self:start;grid-row:3}.run-header__facts{grid-column:auto;grid-row:2}
  .resolution-grid{grid-template-columns:1fr}.outcome-stage{border-left:0;border-top:1px solid var(--border-hair);padding:16px 0 0}.arm-switcher{grid-template-columns:1fr}.arm-switcher .actions{justify-self:start}
}

/* ── guided inspection layer ───────────────────────────────────────────────
   An attention layer over the unchanged spine. It owns three things and no
   more: a choice at the entry, emphasis while a step is current, and markers
   naming what the ablation held constant and what it changed. It introduces no
   node type, no edge type and no semantic colour of its own — emphasis is the
   coupled hue on surfaces and edges, and the markers reuse the existing chip
   grammar. Nothing here dims text. */

/* Emphasis is positive and non-textual.
   The first implementation receded non-current stages with `opacity`. Measured,
   that was wrong twice over: opacity composites *text* toward the background,
   and it multiplies through every ancestor that sets it, so labels already
   muted at 0.6 inside a row at 0.7 inside a stage at 0.62 rendered at 0.26 and
   1.81:1 — far under the AA floor, on text that is still content.
   Nothing below touches text colour, text opacity or any filter. The current
   stage is marked *up* through surface, border, an accent edge, a lift, the
   stage number and the connector into it; a non-current stage simply stops
   being marked. Every property here is colour, background or box-shadow, none
   of which participate in layout, so no step moves anything. */
[data-guide-em]{transition:box-shadow var(--dur-base,220ms) var(--ease-standard),
  border-color var(--dur-base,220ms) var(--ease-standard),
  background-color var(--dur-base,220ms) var(--ease-standard)}
/* The accent edge is an inset shadow rather than a border: a border would
   change the box and shift the stage sideways as the step advances. */
[data-guide-em="focus"]{box-shadow:inset 3px 0 0 0 var(--coupled),0 1px 3px rgba(11,13,14,.10)}
body[data-proof="cloud"] [data-guide-em="focus"]{box-shadow:inset 3px 0 0 0 var(--coupled),0 1px 3px rgba(0,0,0,.4)}
/* Where a stage already owns a left border, the accent recolours it instead of
   sitting beside it. Colour only. */
.evidence-band[data-guide-em="focus"],.decision-bar[data-guide-em="focus"]{border-left-color:var(--coupled)}
.evidence-band[data-guide-em="quiet"],.decision-bar[data-guide-em="quiet"]{border-left-color:var(--border-default)}
.outcome-stage[data-guide-em="focus"]{border-left-color:var(--coupled)}
/* A quiet stage differs by surface, not by legibility. */
.causal-stage[data-guide-em="quiet"] .intent-card{background:var(--surface-sunken)}
.causal-stage[data-guide-em="focus"] .intent-card{background:var(--surface-card);border-color:var(--border-default)}
.arm-switcher[data-guide-em="focus"]{background:var(--surface-sunken)}
/* The stage number is the marker the four-stage spine already uses; the current
   stage fills it. The ring is drawn with box-shadow so the numeral does not
   move when it becomes current. */
[data-guide-em="focus"] .stage-no{background:var(--coupled);color:var(--surface-card);
  border-radius:2px;box-shadow:0 0 0 3px var(--coupled)}
/* Connectors are strokes, not text. A connector is emphasised only when both
   stages it joins are current, so it marks a relationship the step is actually
   making rather than decorating the page. */
.cxn[data-guide-edge="on"] .e-intent,.cxn[data-guide-edge="on"] .e-couple{stroke:var(--coupled);opacity:1}
html[data-static="true"] [data-guide-em],
html[data-reduced-motion="true"] [data-guide-em]{transition:none!important}

.guide-choice{margin:0 24px;padding:12px 16px;border:2px solid currentColor;border-radius:3px;
  background:var(--surface-card);display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"title picks" "copy picks";gap:3px 20px;align-items:center}
.guide-choice h2{grid-area:title;font-size:16px;letter-spacing:-.02em;align-self:end}
.guide-choice p{grid-area:copy;font-size:13px;line-height:1.45;max-width:74ch;color:var(--text-muted);align-self:start}
.guide-choice .picks{grid-area:picks;display:flex;gap:8px;flex-wrap:wrap;justify-self:end}
.guide-choice button{border:2px solid currentColor;border-radius:3px;padding:8px 14px;
  font-size:12.5px;font-weight:600;min-height:var(--tap-target,44px);white-space:nowrap}
.guide-choice button:hover{background:var(--surface-sunken)}
/* "Walk the proof" takes ordinary primary emphasis. "Explore freely" keeps a
   full-weight border and the same tap target: it is the expert path, not a
   decline. Neither carries a pressed or current state — nothing is preselected. */
body[data-proof="local"] .guide-choice button[data-guide-start]{background:var(--ink);color:var(--paper)}
body[data-proof="local"] .guide-choice button[data-guide-start]:hover{background:var(--n80)}

.guide-bar{margin:0 24px;border:1px solid var(--border-default);border-left:3px solid currentColor;
  border-radius:3px;background:var(--surface-card);padding:9px 14px;display:grid;gap:8px}
.guide-bar__top{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.guide-rail{display:flex;gap:4px}
.guide-rail button{border:1.5px solid currentColor;border-radius:2px;padding:4px 8px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;min-height:28px;min-width:32px;
  color:var(--text-muted);border-color:var(--border-default)}
.guide-rail button[data-visited="true"]{color:var(--text-body);border-color:currentColor;background:var(--surface-sunken)}
.guide-rail button[aria-current="step"]{color:var(--text-body);border-color:currentColor}
body[data-proof="local"] .guide-rail button[aria-current="step"]{background:var(--ink);color:var(--paper)}
.guide-count{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.guide-bar__controls{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.guide-bar__controls button{border:2px solid currentColor;border-radius:3px;padding:6px 12px;
  font-size:11.5px;font-weight:600;min-height:36px}
.guide-bar__controls button:hover:not([disabled]){background:var(--surface-sunken)}
.guide-bar__controls button[disabled]{opacity:.4;cursor:not-allowed}
body[data-proof="local"] .guide-bar__controls button[data-guide-next]:not([disabled]){background:var(--ink);color:var(--paper)}
.guide-motion{border:1.5px solid currentColor;border-radius:3px;padding:6px 10px;font-family:var(--mono);
  font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;min-height:36px;
  display:inline-flex;align-items:center}
button.guide-motion[aria-pressed="true"]{background:var(--surface-sunken)}
span.guide-motion{color:var(--text-muted);border-style:dashed;cursor:default}
.guide-step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline}
.guide-step .sn{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--coupled);white-space:nowrap}
.guide-step h2{font-size:17px;letter-spacing:-.02em}
.guide-step p{font-size:13.5px;line-height:1.45;max-width:82ch;margin-top:3px}
.guide-step .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.guide-step .acts button{border:2px solid currentColor;border-radius:3px;padding:7px 12px;
  font-size:11.5px;font-weight:600;min-height:var(--tap-target,44px)}
.guide-step .acts button:hover{background:var(--surface-sunken)}
.guide-aside{font-size:11px;line-height:1.45;color:var(--text-muted);margin-top:8px;max-width:74ch}
.guide-ablate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px}
.guide-ablate button{border:2px solid currentColor;border-radius:3px;padding:7px 12px;font-size:12px;
  font-weight:600;min-height:var(--tap-target,44px)}
.guide-ablate button:hover{background:var(--surface-sunken)}
.guide-ablate .hint{font-family:var(--mono);font-size:9.5px;color:var(--text-muted);line-height:1.4;max-width:60ch}
.guide-reentry{margin:0 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  border:1px dashed var(--border-default);border-radius:3px;padding:7px 14px}
.guide-reentry button{border:2px solid currentColor;border-radius:3px;padding:6px 12px;font-size:11.5px;
  font-weight:600;min-height:36px}
.guide-reentry button:hover{background:var(--surface-sunken)}
.guide-reentry .n{font-family:var(--mono);font-size:9.5px;color:var(--text-muted)}

/* Held / changed markers. Text plus a border treatment, never colour alone;
   "held" reuses the dashed local-state stroke and "changed" the solid coupled
   stroke, so the two read apart in greyscale. */
.mk{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8.5px;
  font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:2px;padding:1px 6px;
  white-space:nowrap}
.mk[data-mk="held"]{border:1px dashed var(--border-default);color:var(--text-muted)}
.mk[data-mk="changed"]{border:1.5px solid var(--coupled);color:var(--coupled)}
.mk::before{content:attr(data-glyph);font-weight:700}
.marks{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
/* A marker sits beside the label it qualifies, so those labels have to wrap
   around it rather than be pushed out of their own card. */
.decision .dk,.res .k,.evidence-ledger>span,.env .row,.env .attr{display:flex;flex-wrap:wrap;
  gap:4px 6px;align-items:center}
.env .attr{display:block}
.env .attr .mk{margin-top:3px}

/* Comparison panel: the same anchored, non-modal drawer as verification, so
   only one side panel can be open and both behave identically. */
.cmp-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cmp-scaffold{border:2px dashed var(--n40);border-radius:2px;padding:2px 7px;font-family:var(--mono);
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.cmp-strats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}
.cmp-strats button{text-align:left;border:2px solid currentColor;border-radius:3px;padding:8px 10px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;min-height:40px}
.cmp-strats button:hover{background:var(--surface-sunken)}
body[data-proof="local"] .cmp-strats button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
body[data-proof="cloud"] .cmp-strats button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.cmp-dim{border-top:1px solid var(--border-hair);padding:8px 0}
.cmp-dim dt{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.cmp-dim .q{font-size:10px;color:var(--text-muted);line-height:1.4;margin-top:2px}
.cmp-dim dd{font-size:12.5px;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.cmp-dim dd[data-bound="false"]{font-family:var(--mono);font-size:11px;color:var(--blocked)}
.cmp-src{font-family:var(--mono);font-size:9px;color:var(--text-muted);margin-top:3px;overflow-wrap:anywhere}

/* The compact desktop frame. Declared after the guided base rules rather than
   with the rest of the density block above it: same specificity, so source
   order is what decides, and the earlier block never won. The contract this
   protects is the cockpit's own — identity, causal chain and verification
   controls inside an 800px-high frame — which the entry module would otherwise
   push the actions row out of. */
@media (min-width:901px) and (max-height:900px){
  .guide-choice{padding:5px 14px;grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"title copy picks";gap:0 16px;align-items:center}
  .guide-choice h2{font-size:14px;white-space:nowrap;align-self:center}
  .guide-choice p{font-size:11.5px;line-height:1.35;align-self:center}
  .guide-choice button{min-height:36px;padding:6px 12px;font-size:11.5px}
  .guide-bar{padding:7px 12px;gap:6px}.guide-bar__controls button,.guide-motion{min-height:30px;padding:4px 10px}
  .guide-step h2{font-size:15px}.guide-step p{font-size:12.5px;margin-top:2px}
  .guide-step .acts{margin-top:6px}.guide-step .acts button{min-height:34px;padding:5px 10px}
  .guide-ablate{margin-top:6px}.guide-ablate button{min-height:34px;padding:5px 10px;font-size:11.5px}
  .guide-ablate .hint{font-size:9px}
  .guide-reentry{padding:5px 12px}.guide-reentry button{min-height:30px}
}
@media (max-width:900px){
  .guide-choice{grid-template-columns:1fr;grid-template-areas:"title" "copy" "picks";gap:6px}
  .guide-choice .picks{justify-self:start}
  .guide-bar__controls{margin-left:0}
}
/* At 320 the rail is replaced by its count plus Back / Next: six 32px targets
   plus four controls cannot share a 288px content width without either
   shrinking below the tap target or forcing the page to scroll sideways. The
   count keeps the position legible and the step sequence is unchanged. */
@media (max-width:640px){
  .guide-choice,.guide-bar,.guide-reentry{margin-left:16px;margin-right:16px}
  .guide-choice .picks{width:100%}.guide-choice .picks button{flex:1}
  .guide-rail{display:none}
  .guide-bar__top{gap:8px}.guide-bar__controls{width:100%;margin-left:0}
  .guide-bar__controls button,.guide-motion{flex:1;min-height:44px}
  .guide-step{grid-template-columns:1fr;gap:4px}
  .guide-step .acts button{width:100%}
  .guide-ablate button{width:100%}
  .cmp-strats{grid-template-columns:1fr}
  /* At 320 the selected numeral is the widest object on the page. It wraps
     rather than clips at 38px, but a bounded outcome split across two lines
     stops reading as one comparison, so it steps down instead. */
  .res[data-selected="true"] .v{font-size:30px}
}
@media (max-width:640px){
  .frame{max-width:100%}.run-header,.run-thesis,.causal-layout{padding-left:16px;padding-right:16px}.run-header__identity{flex-wrap:wrap;gap:9px}.run-header__identity .eyebrow{padding-right:9px}
  .ptitle{font-size:11px;padding-left:9px}.switch .btns{max-width:100%;overflow:auto}.switch button{white-space:normal;min-height:44px}.stage-head{grid-template-columns:22px 1fr}.stage-head>span:last-child{display:none}
  .intents{flex-direction:column}.intent-card{min-height:auto}.causal-stage .cxn{display:none}.evidence-band{margin-top:14px}.resolution-grid{margin-top:14px}.arm-switcher .arms{flex-direction:column}.arm-switcher .actions{width:100%}.arm-switcher .actions button{flex:1}
}
</style>
</head>
<body data-proof="local">
<a class="sr" href="#main">Skip to the run</a>
<main id="app" class="frame"></main>
<aside class="drawer" id="drawer" data-open="false" aria-labelledby="drawer-title"
  tabindex="-1" inert></aside>
<p aria-live="polite" class="sr" id="live"></p>

<script type="module">
/* The cockpit renders the view model. It derives no meaning: every value below
   comes from media/hac-341/evidence/view-model.json, which the adapter builds
   from frozen evidence. A field that is absent there is absent here.
   What the *selected arm* shows is derived in lib/arm-view.mjs, so the binding
   between an arm and its evidence can be asserted without a browser. */
import { armView } from './lib/arm-view.mjs';
/* The guided layer's derivation. It lives beside arm-view.mjs for the same
   reason: step 5 claims that four things were held constant and four changed,
   and a claim like that has to be checked against the frozen arms rather than
   typed into markup. `ablationDelta` reads both arms and reports what actually
   moved, so a marker that has stopped being true fails the gate. */
import { guideView, guideRoute, stateOfStep, stepOfState, GUIDE_STEPS,
  GUIDE_FREE_STATE } from './lib/guide.mjs';

const app = document.getElementById('app');
const drawer = document.getElementById('drawer');

const live = document.getElementById('live');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (s, n = 12) => (s ? `${String(s).slice(0, n)}…` : '');

/* The canonical Interlock lockup: the frozen mark geometry plus a live wordmark
   in the vendored Geist face. Defined once and interpolated wherever a header
   is built, so the two proof classes cannot drift into two identities. The
   paths are the HAC-332 numbers verbatim — see assets/brand/logo-geometry.js,
   which the identity gate reconciles this markup against. */
/* The frozen state grammar carries meaning on three channels: label, glyph and
   colour. Only the states the recorded chain actually emits appear here — there
   is deliberately no entry for a lifecycle state the packets never produced. */
/* Which system boundary each recorded hop belongs to. Derived from the frozen
   `role`, not asserted: it answers "where does Google end and Interlock begin?" */
const LANE_OF = {
  model: 'Google', framework: 'Google', 'model-access': 'Google', host: 'Google',
  control: 'Interlock', decision: 'Interlock',
  effect: 'Protected target', observation: 'Independent observer', correlation: 'Cloud Logging',
};

const STATE_OF = {
  effect: { s: 'executed', g: '⦿', t: 'EXECUTED' },
  observation: { s: 'observed', g: '◎', t: 'OBSERVED' },
};

const brandHtml = `
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M2.889 6 L9.111 6 L17.2 14.089 L17.2 20.311 Z"></path>
        <path d="M45.111 6 L38.889 6 L30.8 14.089 L30.8 20.311 Z"></path>
        <path d="M2.889 42 L9.111 42 L17.2 33.911 L17.2 27.689 Z"></path>
        <path d="M45.111 42 L38.889 42 L30.8 33.911 L30.8 27.689 Z"></path>
        <path class="leaf leaf-l" d="M18.6 16.2 L23.2 19.4 L23.2 28.6 L18.6 31.8 Z"></path>
        <path class="leaf leaf-r" d="M29.4 16.2 L24.8 19.4 L24.8 28.6 L29.4 31.8 Z"></path>
      </svg>
      <span class="word">Interlock</span>
    </div>
    <span class="eyebrow">The Run</span>`;

let MODEL = null;
let lastFocus = null;
/* Which arm was on screen last, so the explanatory transition fires on an arm
   change and not on first paint or on a proof-class reset. */
let lastLocalArm = null;
/* Which guided beat was on screen last, so a step change announces once and a
   re-render for another reason does not. */
let lastGuideState = null;
/* Which side panel is open. One field, because only one panel may be open: two
   booleans would permit a state the layout has no room for. */
let openPanel = 'none';
/* The manual reduced-motion preference. Deliberately not persisted: this
   repository has no preference-storage pattern, and inventing one here would
   put a second, invisible authority beside the OS setting. */
let manualReduced = false;

const params = () => new URLSearchParams(location.search);
if (params().get('static') === '1') document.documentElement.dataset.static = 'true';

/* The OS preference is authoritative and observed live, so a reader who changes
   it mid-session is honoured without a reload. */
const motionQuery = window.matchMedia?.('(prefers-reduced-motion: reduce)') ?? null;
const osReduced = () => Boolean(motionQuery?.matches);
/** The state the surface actually renders in: OS preference, or the manual one. */
const reducedMotion = () => osReduced() || manualReduced;
function applyMotionState() {
  document.documentElement.dataset.reducedMotion = String(reducedMotion());
}
motionQuery?.addEventListener?.('change', () => {
  // The OS wins, so a manual reduction that the OS has now superseded stops
  // being offered as an override it could not deliver.
  applyMotionState();
  resolve();
});
applyMotionState();

/* ---- degraded states are first-class renders, never a blank success ---- */
function degraded(id, requested) {
  const d = (MODEL?.degradedStates ?? []).find((x) => x.id === id)
    ?? { id, message: 'Could not read the pinned record.', forbiddenInference: 'any result' };
  document.body.dataset.proof = 'local';
  lastLocalArm = null;
  app.innerHTML = `<header class="degraded-head">${brandHtml}</header>
  <div class="degraded" data-state="${esc(id)}">
    <h2>${esc(d.message)}</h2>
    ${requested ? `<p class="mono">Requested: ${esc(requested)}</p>` : ''}
    <p class="refused">Substitution refused. The canonical run is not shown in place of what was asked for.</p>
    <p class="note" style="margin-top:12px">Do not infer ${esc(d.forbiddenInference)}.</p>
    <div class="next"><span class="k">Where to go instead</span>
    <p><a href="?run=hac330-local&proof=local&state=run.local.treatment">Open the controlled local experiment</a>
    &nbsp;·&nbsp; <a href="?run=hac340-cloud&proof=cloud&state=run.cloud.overview">Open the Google Cloud run</a></p></div>
  </div>`;
  live.textContent = d.message;
}

/* ---- L1 ---- */

/** The evidence line for the selected arm, in that arm's own terms. */
function evidenceLine(v) {
  const cp = v.evidence.couplings[0];
  if (!v.evidence.consulted) {
    return `${esc(v.evidence.source)} · not consulted<br>Interlock was disabled in this arm`;
  }
  const basis = `basis <b>${esc(short(v.evidence.basis))}</b>`;
  return `${esc(v.evidence.source)} · revision-bound<br>${basis} · ${cp
    ? `coupling support ${esc(cp.support)}/${esc(cp.occurrences)}`
    : 'no qualifying coupling'}`;
}

/** The falsification, stated where the change happens. */
function deltaHtml(v) {
  if (!v.evidenceChanged) return '';
  return `<div class="delta" data-holds="${v.arm.outcome.holds}">
      <span class="dl">Evidence changed</span>
      <p class="dtext">Same intents, same shared environment, same bound. Only the frozen
        evidence differs: basis <span class="mono">${esc(short(v.evidence.basis))}</span>
        replaces <span class="mono">${esc(short(v.referenceBasis))}</span>.</p>
      <p class="dchain"><span class="dtok">${esc(v.arm.decision)}</span>
        <span class="dar" aria-hidden="true">→</span>
        <span class="dv">${esc(v.arm.outcome.expression)}</span></p>
      <p class="ddetail">${esc(v.arm.decisionDetail ?? '')}</p>
    </div>`;
}

const outcomeCard = (row, selectedArm, g) => `
      <div class="res" data-holds="${row.outcome.holds}" data-row="${esc(row.key)}" data-arm="${esc(row.armId)}" data-selected="${row.armId === selectedArm}">
        <div class="cause"><span class="cxl" aria-hidden="true"></span>
          <span class="sr">Cause:</span><span class="ctok">${esc(row.cause)}</span></div>
        <div class="k">${esc(row.label)}${row.key === 'selected' ? marker(g, 'outcome') : ''}</div>
        <div class="v" data-glyph="${row.outcome.holds ? '✓' : '✕'}">${esc(row.outcome.expression)}</div>
        <div class="n">${esc(row.outcome.verdict)}${row.checksLabel ? ` · run checks ${esc(row.checksLabel)}` : ''}</div>
      </div>`;

/* ---- the guided inspection layer ----
   Emphasis, copy and markers over the spine the cockpit already draws. It adds
   no run, no arm and no number: every value it shows is read back out of the
   same view model through the same derivations, so a guided step cannot state
   something the free cockpit would contradict. */

/**
 * Mark the current stage up, rather than marking the others down.
 *
 * Returns an attribute the stylesheet turns into surface, border, accent edge,
 * stage-number fill and a lift — never into text opacity. Outside guided mode
 * every stage is `full`: there is no current step, so nothing is emphasised.
 */
const em = (g, region) => {
  if (g.mode !== 'guided' || g.focus.length === 0) return ' data-guide-em="full"';
  return g.focus.includes(region) ? ' data-guide-em="focus"' : ' data-guide-em="quiet"';
};

/**
 * A connector is emphasised only when both stages it joins are current.
 * Step 02 joins the intents to the environment; step 03 joins the evidence to
 * the decision. Anything else leaves the stroke as the grammar draws it.
 */
const edge = (g, a, b) => (g.mode === 'guided' && g.focus.includes(a) && g.focus.includes(b)
  ? ' data-guide-edge="on"' : '');

/**
 * A held-constant or changed marker for one ablation row.
 *
 * Rendered from `ablationDelta`, which reads both frozen arms, so the marker
 * reports what the record actually did. A row whose claim has stopped matching
 * the evidence is dropped here and refused by the gate rather than drawn.
 */
function marker(g, id) {
  if (!g.showMarkers) return '';
  const row = g.delta.rows.find((r) => r.id === id);
  if (!row) return '';
  const truthful = row.kind === 'held' ? !row.differs : row.differs;
  if (!truthful) return '';
  return row.kind === 'held'
    ? '<span class="mk" data-mk="held" data-glyph="=">Held constant</span>'
    : `<span class="mk" data-mk="changed" data-glyph="\u0394">Changed \u00b7 ${esc(row.label.toLowerCase())}</span>`;
}

/** The entry choice. Nothing is preselected and nothing is obscured by it. */
const choiceHtml = () => `
  <section class="guide-choice" aria-labelledby="guide-choice-title">
    <h2 id="guide-choice-title">Inspect the run</h2>
    <p>Two actions can be valid alone and unsafe together. Follow the recorded
      proof, or inspect everything yourself.</p>
    <div class="picks">
      <button data-guide-start>Walk the proof</button>
      <button data-guide-free>Explore freely</button>
    </div>
  </section>`;

/**
 * The reduced-motion control, which must name the state that is actually in
 * force. When the OS asks for reduced motion there is nothing to toggle, so the
 * control is withdrawn and replaced by a status: offering "Enable motion" that
 * the preference would immediately override would be a lie about who is in
 * charge.
 */
function motionControlHtml() {
  if (osReduced()) {
    return `<span class="guide-motion" role="status">Reduced motion \u00b7 system preference</span>
      <span class="sr">Your system requests reduced motion. Staged transitions are replaced with
        immediate state changes. The step sequence, copy and markers are unchanged.</span>`;
  }
  const label = manualReduced ? 'Enable motion' : 'Reduce motion';
  const desc = manualReduced
    ? 'Restores the staged transitions. The step sequence and copy are identical either way.'
    : 'Replaces staged transitions with immediate state changes.';
  return `<button class="guide-motion" data-guide-motion aria-pressed="${manualReduced}"
    title="${esc(desc)}">${label}</button>`;
}

/** Guided controls. Never auto-advances; never blocks the cockpit behind it. */
function guideBarHtml(g) {
  const total = String(g.total).padStart(2, '0');
  const rail = GUIDE_STEPS.map((step, i) => {
    const n = i + 1;
    const current = n === g.step;
    return `<button data-guide-step="${n}" data-focus-key="rail-${n}"
      aria-current="${current ? 'step' : 'false'}" data-visited="${n < g.step}"
      tabindex="${current ? 0 : -1}" title="${esc(step.name)}"><span class="sr">Step </span>${esc(step.no)}</button>`;
  }).join('');
  return `
  <section class="guide-bar" aria-labelledby="guide-step-title">
    <div class="guide-bar__top">
      <div class="guide-rail" data-guide-rail role="group"
        aria-label="Proof walk steps \u00b7 left and right arrow keys move between steps">${rail}</div>
      <span class="guide-count">Step ${esc(g.stepNo)} of ${total}</span>
      <div class="guide-bar__controls">
        ${motionControlHtml()}
        <button data-guide-back data-focus-key="back" ${g.isFirst ? 'disabled' : ''}>Back</button>
        <button data-guide-next data-focus-key="next" ${g.isLast ? 'disabled' : ''}>Next</button>
        <button data-guide-exit>Exit to cockpit</button>
      </div>
    </div>
    <div class="guide-step">
      <span class="sn">Step ${esc(g.stepNo)} / ${total}</span>
      <div>
        <h2 id="guide-step-title">${esc(g.title)}</h2>
        <p>${esc(g.copy)}</p>
        ${g.isAblation ? `<div class="guide-ablate">
          <button data-guide-ablate="${esc(g.ablation.targetArm)}">${esc(g.ablation.label)}</button>
          <span class="hint">${esc(g.ablation.note)} Each arm is a recorded result;
            nothing is executed in the browser.</span>
        </div>` : ''}
        ${g.isHandoff ? `<div class="acts">
          <button data-drawer="verify">Verify this decision</button>
          <button data-drawer="compare">Compare coordination strategies</button>
          <button data-guide-exit>Explore the complete cockpit</button>
        </div>
        <p class="guide-aside">Also recorded \u00b7 Google Cloud participation is a separate proof
          class. Its switch stays in the header and is never opened for you.</p>` : ''}
      </div>
    </div>
  </section>`;
}

/** Free inspection keeps the way back in visible rather than one-way. */
const reentryHtml = () => `
  <div class="guide-reentry">
    <button data-guide-start>Walk the proof</button>
    <span class="n">Free inspection \u00b7 every control is live \u00b7 nothing is executed in the browser</span>
  </div>`;

function guideLayerHtml(g) {
  if (g.mode === 'choice') return choiceHtml();
  if (g.mode === 'guided') return guideBarHtml(g);
  return reentryHtml();
}

function renderLocal(run, armId, g) {
  const v = armView(run, armId);
  const isBaseline = v.arm.armId === v.baseline?.armId;
  const coupling = v.evidence.couplings[0];
  const evidenceState = v.coupled ? 'COUPLED' : 'NO QUALIFYING COUPLING';
  return `
  <header class="run-header">
    <div class="run-header__identity">${brandHtml}<h1 class="ptitle">${esc(run.proofLabel)}</h1></div>
    ${switchHtml('local')}
    <div class="pin run-header__facts">
      <div><span class="k">Run</span><span class="v">${esc(run.runIdentity)}</span></div>
      <div><span class="k">Issue</span><span class="v">${esc(run.sourceIssue)}</span></div>
      <div><span class="k">State</span><span class="v">FROZEN</span></div>
      <div><span class="k">Checks</span><span class="v">${esc(run.checks.label)}</span></div>
    </div>
  </header>
  <div class="verdict run-thesis"><span class="tag">CAUSAL CLAIM</span><p>${esc(run.editorial.verdict)}</p></div>
  ${guideLayerHtml(g)}
  <div class="causal-layout" id="main">
    <section class="causal-stage" aria-labelledby="inputs-title"${em(g, 'intents')}>
      <div class="stage-head"><span class="stage-no">01</span><h2 id="inputs-title">Locally valid inputs</h2><span>independent scopes</span></div>
      <div class="intents">
        <div class="card intent-card"><span class="intent-id">Intent A</span><h3>Reservation change</h3>
          <div class="marks"><span class="chip" data-s="local" data-glyph="∙">Locally valid</span>${marker(g, 'intent.a')}</div></div>
        <div class="card intent-card"><span class="intent-id">Intent B</span><h3>Reservation change</h3>
          <div class="marks"><span class="chip" data-s="local" data-glyph="∙">Locally valid</span>${marker(g, 'intent.b')}</div></div>
      </div>
      <div class="cxn"${edge(g, 'intents', 'evidence')} aria-hidden="true"><svg viewBox="0 0 100 26" preserveAspectRatio="none" focusable="false">
        <path class="e-intent" d="M25 1 L25 13 L75 13 L75 1"></path>
        <path class="e-couple" d="M50 13 L50 25"></path></svg></div>
    </section>
    <section class="evidence-band env" data-coupled="${v.coupled}" aria-labelledby="evidence-title"${em(g, 'evidence')}>
      <div class="stage-head"><span class="stage-no">02</span><h2 id="evidence-title">Revision-bound evidence</h2><span>frozen basis</span></div>
      <div class="env__body">
        <div class="row"><span class="lbl">Shared environment</span>
          ${v.coupled ? '<span class="chip" data-s="coupled" data-glyph="⧉">Coupled</span>' : ''}
          ${marker(g, 'environment')}
          <span class="bound">joint bound &lt;= ${esc(v.constraint.bound)}</span>${marker(g, 'bound')}</div>
        <div class="attr">${evidenceLine(v)} ${marker(g, 'evidence.basis')}</div>
        <div class="evidence-ledger"><span><b>finding</b> ${esc(evidenceState)}${marker(g, 'evidence.finding')}</span>${coupling ? `<span><b>files</b> ${esc(coupling.files.join(' · '))}</span>` : '<span><b>effect</b> evidence does not establish coupling</span>'}</div>
      </div>
      ${deltaHtml(v)}
    </section>
    <div class="cxn short causal-drop"${edge(g, 'evidence', 'decision')} aria-hidden="true"><svg viewBox="0 0 100 20" preserveAspectRatio="none" focusable="false">
        <path class="e-couple" d="M50 0 L50 19"></path></svg></div>
    <div class="resolution-grid">
      <section class="decision decision-bar" aria-labelledby="decision-title"${em(g, 'decision')}>
        <div class="stage-head"><span class="stage-no">03</span><h2 id="decision-title">Coordination decision</h2><span>recorded, not recomputed</span></div>
        <div class="decision__body">
        <div class="dk">Interlock decision · deterministic${marker(g, 'decision')}</div>
        <div class="tok">${esc(v.arm.decision ?? 'no decision — Interlock disabled')}</div>
        ${v.arm.decisionReason ? `<div class="why">${esc(v.arm.decisionReason)}</div>` : ''}
        <div class="frozen">FROZEN ARM · NOT RECOMPUTED</div>
        </div>
      </section>
      <section class="outcome-stage" aria-labelledby="outcome-title"${em(g, 'outcome')}>
        <div class="stage-head"><span class="stage-no">04</span><h2 id="outcome-title">Bounded joint outcome</h2><span>baseline vs selected arm</span></div>
        <div class="results">${v.comparison.map((row) => outcomeCard(row, v.arm.armId, g)).join('')}</div>
      </section>
    </div>
    <section class="arm-switcher"${em(g, 'control')}>
      ${isBaseline ? `<p class="armnote lead">Interlock was disabled in this arm, so no coordination
        occurred and there is no second result to compare it against. Select
        <b>Treatment · original evidence</b> or <b>Perturbed evidence</b> to see what the
        coordination decision changes.</p>` : ''}
      <div class="arms" role="group" aria-label="Recorded arm">
        ${run.arms.map((a) => `<button data-arm="${esc(a.armId)}" aria-pressed="${a.armId === v.arm.armId}">${esc(a.label)}</button>`).join('')}
      </div>

}

/**
 * The persistent verification row.
 *
 * While the walk is running the current step owns the primary contextual
 * action, so this row is demoted to secondary weight — same text colour, same
 * tab order, same targets, just no longer competing for the eye with the step
 * that is speaking. On the handoff step the two actions the step itself offers
 * are dropped from here outright: the same control twice, eighty pixels apart,
 * reads as two different things.
 *
 * It is never emptied. `Show me the raw proof` and `What is not claimed?` have
 * no equivalent in any step panel, and no step may take away the expert path.
 */
function actionsHtml(g) {
  const duplicated = g.isHandoff ? new Set(['verify', 'compare']) : new Set();
  const all = [
    ['verify', 'Verify this decision'],
    ['compare', 'Compare coordination strategies'],
    ['raw', 'Show me the raw proof'],
    ['claim', 'What is not claimed?'],
  ].filter(([kind]) => !duplicated.has(kind));
  return `<div class="actions" aria-label="Verification actions"
    data-guide-weight="${g.mode === 'guided' ? 'secondary' : 'primary'}">
        ${all.map(([kind, label]) => `<button data-drawer="${kind}">${esc(label)}</button>`).join('')}
      </div>`;
}

function cloudHops(run) {
  let lane = null;
  return run.events.map((h) => {
    const l = LANE_OF[h.role] ?? '';
    const fresh = l !== lane;
    lane = l;
    const st = STATE_OF[h.role];
    const detail = truncate(h.detail);
    return `<div class="hop" data-role="${esc(h.role)}" data-lane="${fresh ? 'new' : 'same'}">
          <span class="n">${fresh ? esc(l) : ''}</span>
          <span class="t">${esc(h.label)}</span>
          <span class="d">${st ? `<span class="chip" data-s="${st.s}" data-glyph="${st.g}">${st.t}</span> ` : ''}${detail === st?.t ? '' : esc(detail)}</span>
        </div>`;
  }).join('');
}

const truncate = (s, max = 26) => {
  if (!s) return '';

let copySeq = 0;
/** Which strategy the comparison panel is showing. One index, not four flags. */
let compareStrategy = 0;
/** A value plus an offline copy control. The evidence text is never altered. */
function copyable(value, label) {
  copySeq += 1;

/**
 * One recorded arm's evidence, in that arm's own terms. Extracted so the
 * panel's markup does not nest a conditional inside a conditional inside two
 * levels of template.

function armEvidenceRow(a) {
  if (!a.basisRevision) return 'Interlock disabled — evidence not consulted';
  const basis = `basis ${copyable(a.basisRevision, `the ${a.armId} basis revision`)}`;
  const cp = (a.couplings ?? [])[0];
  if (!cp) return `${basis} · no qualifying coupling`;
  return `${basis} · coupling support ${esc(cp.support)}/${esc(cp.occurrences)}`;
}

/**
 * The coordination-strategy comparison, bound to HAC-343.

 * A different experiment from the one on screen, and drawn as one: every cell
 * carries the frozen artifact and field it was read from, and nothing is
 * carried across from the HAC-330 arm beside it. When a binding cannot be

function comparisonHtml() {

function drawerHtml(kind, proof, run) {
  copySeq = 0;
  const title = { verify: 'Can I verify it?', raw: 'Raw proof', claim: 'Claim boundary', compare: 'Coordination strategies' }[kind];
  let body = '';
  if (kind === 'compare') {
    body = comparisonHtml();
  } else if (kind === 'claim') {
    body = `<div class="bnd">
      <div class="p"><h3>Proves</h3><ul>${run.claimBoundary.proves.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>

    body = kind === 'verify' ? localVerify(run) : localRaw(run);

    body = kind === 'verify' ? cloudVerify(run) : cloudRaw(run);

  // The panel explains the arm that is on screen, so it says which arm that is.
  // Opening verification from the perturbed arm and reading the treatment's
  // basis is the exact defect `arm-view.mjs` exists to prevent.
  const selected = proof === 'local' && kind !== 'compare'
    ? armView(run, currentArm()).arm

  const c = MODEL.comparison;

  return `<button class="close" data-close aria-label="Close">×</button>
    <h2 id="drawer-title">${esc(title)}</h2>

}
