/* ---- copy, without a dependency and without a network ---- */

/** Last-resort path for a non-secure context; no library, no remote call. */
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

async function runCopy(btn) {
  const src = document.getElementById(btn.dataset.copy);
  if (!src) return;
  const text = src.textContent;
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    ok = legacyCopy(text);
  }
  btn.dataset.copied = String(ok);
  btn.textContent = ok ? 'Copied' : 'Failed';
  live.textContent = ok ? 'copied to clipboard' : 'copy failed; select the text manually';
  setTimeout(() => {
    if (!btn.isConnected) return;
    btn.dataset.copied = 'false';
    btn.textContent = 'Copy';
  }, 1600);
}

/**
 * Open one side panel.
 *
 * There is one panel element, so a second panel cannot be opened beside the
 * first: opening `compare` over `verify` replaces it. That is the constraint
 * the anchored layout actually has, expressed once rather than defended in
 * three handlers.
 *
 * Focus moves in synchronously — a ref and the element that exists right now,
 * not a timeout — and the opener is stored so Escape and Close can return it.
 */
function openDrawer(kind) {
  const { proof, run } = current();
  // Re-opening the panel that is already open closes it, so a toggle control
  // tells the truth about what pressing it again does.
  if (openPanel === kind) return closeDrawer();
  // The opener is whichever control opened *this* panel, including when one
  // panel replaces another: returning focus to the control that opened the
  // panel before it would land the reader somewhere they did not come from.
  // A control inside the panel is never the opener; it is about to be replaced.
  const opener = document.activeElement;
  if (opener && !drawer.contains(opener)) lastFocus = opener;
  drawer.innerHTML = drawerHtml(kind, proof, run);
  drawer.dataset.open = 'true';
  drawer.dataset.panel = kind;
  openPanel = kind;
  document.body.dataset.drawer = 'open';
  drawer.removeAttribute('inert');
  // Focus moves into the panel so a keyboard user lands on the new content,
  // but nothing is trapped: Tab walks out of the panel and back into the run.
  drawer.focus({ preventScroll: true });
  const { run: r } = current();
  const armName = proof === 'local' ? `, arm ${armView(r, currentArm()).arm.label}` : '';
  live.textContent = `${kind} panel opened${armName}. The run stays visible beside it.`;
}
function closeDrawer() {
  if (drawer.dataset.open !== 'true') return;
  drawer.dataset.open = 'false';
  drawer.dataset.panel = 'none';
  openPanel = 'none';
  document.body.dataset.drawer = 'closed';
  drawer.setAttribute('inert', '');
  drawer.innerHTML = '';
  live.textContent = 'panel closed';
  // A non-modal panel restores nothing on its own, and a re-render may have
  // replaced the opener while it was open.
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  else document.querySelector('[data-drawer]')?.focus({ preventScroll: true });
}

/* ---- routing: every address maps to a real state, or to an explicit one ---- */
function current() {
  const q = params();
  const proof = q.get('proof') ?? 'local';
  const run = proof === 'cloud' ? MODEL.runs.cloud : MODEL.runs.local;
  return { proof, run };
}
/** The recorded arm the address selects, so a panel can name it. */
function currentArm() {
  const state = params().get('state') ?? 'run.local.overview';
  const id = state === 'run.local.overview'
    ? MODEL.deepLink.aliases['run.local.overview'].replace('run.local.', '')
    : state.replace('run.local.', '');
  return MODEL.runs.local.arms.some((a) => a.armId === id) ? id : MODEL.runs.local.defaultArm;
}
/** Renders a declared degraded state on request. Never substitutes a real run. */
function renderForcedDegraded(id) {
  const declared = (MODEL?.degradedStates ?? []).some((d) => d.id === id);
  return degraded(declared ? id : 'run.missing', `degraded=${id}`);
}

/** Steps the three regions an arm change actually moves. Plays once. */
function markArmChange() {
  for (const sel of ['.env', '.delta', '.decision', '.results']) {
    app.querySelector(sel)?.setAttribute('data-il-motion', 'arm');
  }
}

/**
 * Resolve an address to a renderable state, or to the address that earned a
 * refusal. Returns `{ missing }` — the requested address, echoed back — or
 * `{ proof, state, armId }`. Every guard here refuses rather than correcting:
 * a cloud state under the local class is not quietly fixed up, and no branch
 * falls through to the canonical run.
 */
function route(q) {
  const runId = q.get('run') ?? 'hac330-local';
  const proof = q.get('proof') ?? (runId === 'hac340-cloud' ? 'cloud' : 'local');
  let state = q.get('state') ?? (proof === 'cloud' ? 'run.cloud.overview' : 'run.local.overview');
  if (state === 'run.local.overview') state = MODEL.deepLink.aliases['run.local.overview'];

  const known = { 'hac330-local': 'local', 'hac340-cloud': 'cloud' };
  if (!(runId in known)) return { missing: `run=${runId}` };
  if (known[runId] !== proof) return { missing: `run=${runId}&proof=${proof}` };

  // The guided layer is a second axis on the same address: `state` still names
  // the recorded arm and `guide` names which beat is emphasised. It is refused
  // on the same terms as everything else — an unknown beat, or a beat asked for
  // under the wrong proof class, is not quietly corrected to step one.
  const guideParam = q.get('guide');
  const guide = guideRoute(guideParam);
  if (!guide) return { missing: `guide=${guideParam}` };
  if (proof !== 'local' && guideParam && guide.mode !== 'choice') {
    return { missing: `proof=${proof}&guide=${guideParam}` };
  }

  const wantsLocal = state.startsWith('run.local.');
  const wantsCloud = state.startsWith('run.cloud.');
  if ((wantsLocal && proof !== 'local') || (wantsCloud && proof !== 'cloud')) {
    return { missing: `proof=${proof}&state=${state}` };
  }
  if (proof === 'cloud') {
    if (state !== 'run.cloud.overview') return { missing: `state=${state}` };
    return { proof, state, guide };
  }
  const armId = state.replace('run.local.', '');
  if (!MODEL.runs.local.arms.some((a) => a.armId === armId)) return { missing: `state=${state}` };
  return { proof, state, armId, guide };
}

/**
 * Re-render without losing the reader's place.
 *
 * A step change replaces the markup, which would otherwise drop focus to the
 * body and send a keyboard reader back to the top of the document. Controls
 * that survive a step carry a stable `data-focus-key`, so focus returns to the
 * same control — with `preventScroll`, because a step must never scroll the
 * evidence it is talking about out of view.
 */
function renderRoute(r) {
  const key = document.activeElement?.closest?.('[data-focus-key]')?.dataset.focusKey ?? null;
  if (r.proof === 'local') {
    document.body.dataset.proof = 'local';
    const g = guideView(MODEL.runs.local, {
      mode: r.guide.mode, step: r.guide.step, armId: r.armId, reducedMotion: reducedMotion(),
    });
    const armChanged = lastLocalArm !== null && lastLocalArm !== r.armId;
    app.innerHTML = renderLocal(MODEL.runs.local, r.armId, g);
    document.documentElement.dataset.guideState = g.stateId;
    // The one explanatory transition: the three regions an arm change actually
    // moves, stepped in the order evidence -> decision -> outcome. Reduced
    // motion replaces it with an immediate swap; the markers and the copy that
    // say what changed stay on screen either way.
    if (armChanged) markArmChange();
    announce(g, r.armId, armChanged);
    lastLocalArm = r.armId;
    lastGuideState = g.stateId;
    if (key) app.querySelector(`[data-focus-key="${key}"]`)?.focus({ preventScroll: true });
    return;
  }
  document.body.dataset.proof = 'cloud';
  app.innerHTML = renderCloud(MODEL.runs.cloud);
  // The guided layer is class A's. Stamping `guide.local.choice` here put a
  // local-namespaced id on a class-B page, so a capture harness selecting
  // `[data-guide-state^="guide.local."]` matched cloud frames. No value ever
  // crossed — renderCloud ignores the guide axis entirely — but the attribute
  // did, and on this surface a proof-class boundary is not a detail.
  document.documentElement.dataset.guideState = 'none';
  lastLocalArm = null;
  lastGuideState = null;
}

/**
 * One polite announcement per meaningful change, and none for a re-render that
 * changed nothing. A live region that repeats the whole page on every keystroke
 * is noise, and noise is how the useful announcements get missed.
 */
function announce(g, armId, armChanged) {
  const parts = [];
  if (g.stateId !== lastGuideState) parts.push(g.announce);
  if (armChanged) parts.push(g.armAnnounce);
  if (!parts.length) parts.push(`${MODEL.runs.local.proofLabel} · ${armId}`);
  live.textContent = parts.join(' ');
}

function resolve() {
  const q = params();
  // Deterministic hook for the declared degraded states that no ordinary
  // address reaches. Every state in the view model must be renderable and
  // capturable; a state that can only be described is a state nobody has seen.
  // This is a capture and test affordance, not a navigation entry: it never
  // fires unless explicitly asked for, and it never substitutes a real run.
  if (q.get('degraded')) return renderForcedDegraded(q.get('degraded'));
  const r = route(q);
  if (r.missing) return degraded('run.missing', r.missing);
  applyMotionState();
  document.documentElement.dataset.semanticState = r.state;
  // renderRoute owns the announcement: it is the only place that knows whether
  // the step, the arm, both or neither actually moved.
  renderRoute(r);
  if (r.proof === 'cloud') live.textContent = `${MODEL.runs.cloud.proofLabel} · ${r.state}`;
}
function go(next, replace) {
  const q = params();
  for (const [k, v] of Object.entries(next)) v === null ? q.delete(k) : q.set(k, v);
  history[replace ? 'replaceState' : 'pushState']({}, '', `?${q}`);
  closeDrawer(); resolve();
}

const SELECTORS = '[data-arm],[data-proof],[data-drawer],[data-close],[data-copy],'
  + '[data-guide-start],[data-guide-free],[data-guide-exit],[data-guide-step],[data-guide-back],'
  + '[data-guide-next],[data-guide-ablate],[data-guide-motion],[data-strat]';

/** Move the walk without touching the arm: the two axes stay independent. */
const goStep = (n) => go({ guide: stateOfStep(n) }, true);

document.addEventListener('click', (e) => {
  const t = e.target.closest(SELECTORS);
  if (!t) return;
  if (t.dataset.copy) return runCopy(t);
  if (t.dataset.close !== undefined) return closeDrawer();
  if (t.dataset.drawer) { t.focus(); return openDrawer(t.dataset.drawer); }

  /* ---- the guided layer ---- */
  if (t.dataset.guideStart !== undefined) return go({ guide: stateOfStep(1) });
  if (t.dataset.guideFree !== undefined || t.dataset.guideExit !== undefined) {
    // Exiting is a real exit: the walk closes and the complete cockpit is what
    // is left, with the arm the reader had selected still selected.
    return go({ guide: GUIDE_FREE_STATE });
  }
  if (t.dataset.guideStep) return goStep(Number(t.dataset.guideStep));
  if (t.dataset.guideBack !== undefined) return goStep(currentStep() - 1);
  if (t.dataset.guideNext !== undefined) return goStep(currentStep() + 1);
  if (t.dataset.guideAblate) {
    // Selects the recorded arm. It does not edit, delete or recompute evidence.
    return go({ state: `run.local.${t.dataset.guideAblate}` });
  }
  if (t.dataset.guideMotion !== undefined) {
    // Only reachable when the OS has not already asked for reduced motion, so
    // the control can only ever name an action it is able to perform.
    manualReduced = !manualReduced;
    applyMotionState();
    live.textContent = manualReduced
      ? 'Reduced motion. Staged transitions are replaced with immediate state changes.'
      : 'Motion enabled. Staged transitions are restored.';
    return resolve();
  }
  if (t.dataset.strat !== undefined) {
    compareStrategy = Number(t.dataset.strat);
    const { proof, run } = current();
    drawer.innerHTML = drawerHtml('compare', proof, run);
    const focused = drawer.querySelector(`[data-focus-key="strat-${compareStrategy}"]`);
    focused?.focus({ preventScroll: true });
    live.textContent = `${MODEL.comparison.strategies[compareStrategy].label}. ${MODEL.comparison.strategies[compareStrategy].cells[0].value}.`;
    return;
  }

  if (t.dataset.arm) return go({ state: `run.local.${t.dataset.arm}` });
  if (t.dataset.proof) {
    // Atomic context replacement: run, proof and state all change together, and
    // the guided layer goes with them. The cloud class is a separate proof
    // class; it does not continue the local causal chain and is never entered
    // mid-walk.
    const CONTEXTS = {
      cloud: { run: 'hac340-cloud', proof: 'cloud', state: 'run.cloud.overview', guide: null },
      local: { run: 'hac330-local', proof: 'local', state: 'run.local.treatment', guide: null },
    };
    return go(CONTEXTS[t.dataset.proof]);
  }
});

/** The step the address currently names, or 1 outside guided mode. */
function currentStep() {
  return stepOfState(params().get('guide')) ?? 1;
}

/**
 * Keyboard.
 *
 * Escape is the only key bound globally, because closing the open panel is the
 * only action that makes sense wherever focus happens to be. Left and Right are
 * scoped to the two roving groups by asking where the event came from *first*:
 * they must not move a step while a reader is inside a scrollable proof block,
 * a code sample or any other control.
 *
 * Back and Next are the universal path and never depend on an arrow key.
 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawer.dataset.open === 'true') return closeDrawer();
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const rail = e.target.closest?.('[data-guide-rail]');
  const strats = e.target.closest?.('[data-strat-group]');
  if (!rail && !strats) return;
  e.preventDefault();
  if (rail) {
    const last = GUIDE_STEPS.length;
    const step = currentStep();
    const next = e.key === 'Home' ? 1
      : e.key === 'End' ? last
        : step + (e.key === 'ArrowRight' ? 1 : -1);
    if (next < 1 || next > last) return;
    return goStep(next);
  }
  const last = MODEL.comparison.strategies.length - 1;
  const next = e.key === 'Home' ? 0
    : e.key === 'End' ? last
      : compareStrategy + (e.key === 'ArrowRight' ? 1 : -1);
  if (next < 0 || next > last) return;
  drawer.querySelector(`[data-strat="${next}"]`)?.click();
});
drawer.addEventListener('click', (e) => { if (e.target === drawer) closeDrawer(); });
addEventListener('popstate', () => { closeDrawer(); resolve(); });

try {
  const res = await fetch('./evidence/view-model.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(String(res.status));
  MODEL = await res.json();
  resolve();
} catch {
  MODEL = null;
  degraded('run.unavailable', location.search || '(default)');
}
</script>
</body>
</html>
