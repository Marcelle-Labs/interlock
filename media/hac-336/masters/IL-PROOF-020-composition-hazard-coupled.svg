<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="board-title board-desc"><title id="board-title">IL-PROOF-020 One shared environment, one joint bound - coupled</title><desc id="board-desc">CONTROLLED LOCAL EXPERIMENT. Frozen evidence: sum(services[].reserved) &lt;= 130  checks 24/24 Non-claim: this experiment ran locally, not on Google Cloud; no cloud runtime, receipt, protected target or observer exists in it</desc><rect x="0" y="0" width="1920" height="1080" fill="#fbfbfa"/><text x="88" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#737b7b" letter-spacing="3">CONTROLLED LOCAL EXPERIMENT</text><text x="1832" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#737b7b" text-anchor="end" letter-spacing="2">IL-PROOF-020</text><line x1="88" y1="116" x2="1832" y2="116" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="184" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="50" font-weight="600" fill="#0b0d0e" letter-spacing="-0.8">One shared environment, one joint bound</text><rect x="88" y="300" width="560" height="132" fill="none" stroke="#c2c7c7" stroke-width="1"/><text x="116" y="352" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" fill="#0b0d0e">Intent A</text><rect x="116" y="374" width="207.6" height="37.8" fill="none" stroke="#787b7d" stroke-width="1"/><circle cx="134.9" cy="392.9" r="2.57" fill="#787b7d" stroke="none" stroke-width="1"/><text x="153.8" y="399.38" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#787b7d" letter-spacing="1.1">LOCALLY VALID</text><line x1="648" y1="366" x2="753.82" y2="455.76" stroke="#347ec4" stroke-width="2" stroke-linecap="butt"/><path d="M751.3591495941838 458.4829175094355 L760 461 L756.1068817294599 452.8855912025837" fill="none" stroke="#347ec4" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><rect x="88" y="490" width="560" height="132" fill="none" stroke="#c2c7c7" stroke-width="1"/><text x="116" y="542" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" fill="#0b0d0e">Intent B</text><rect x="116" y="564" width="207.6" height="37.8" fill="none" stroke="#787b7d" stroke-width="1"/><circle cx="134.9" cy="582.9" r="2.57" fill="#787b7d" stroke="none" stroke-width="1"/><text x="153.8" y="589.38" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#787b7d" letter-spacing="1.1">LOCALLY VALID</text><line x1="648" y1="556" x2="753.82" y2="466.24" stroke="#347ec4" stroke-width="2" stroke-linecap="butt"/><path d="M756.1068817294599 469.1144087974163 L760 461 L751.3591495941838 463.5170824905645" fill="none" stroke="#347ec4" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/><rect x="768" y="300" width="1064" height="322" fill="none" stroke="#347ec4" stroke-width="2"/><text x="796" y="356" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" fill="#0b0d0e">Shared environment</text><rect x="796" y="382" width="136.2" height="37.8" fill="none" stroke="#347ec4" stroke-width="2"/><rect x="807.34" y="393.34" width="11.34" height="11.34" fill="none" stroke="#347ec4" stroke-width="1.8"/><rect x="811.12" y="397.12" width="11.34" height="11.34" fill="none" stroke="#347ec4" stroke-width="1.8"/><text x="833.8" y="407.38" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#347ec4" letter-spacing="1.1">COUPLED</text><text x="796" y="500" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b" letter-spacing="2.2">JOINT BOUND</text><text x="796" y="544" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="25" font-weight="400" fill="#0b0d0e">sum(services[].reserved) &lt;= 130</text><text x="796" y="590" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">Revision-bound, and derived from the commit history rather than declared.</text><text x="88" y="706" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="30" font-weight="400" fill="#737b7b">They write into the same environment, so the constraint applies to their joint outcome, not to either change alone.</text><line x1="88" y1="962" x2="1832" y2="962" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="996" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b">Frozen evidence: sum(services[].reserved) &lt;= 130  checks 24/24</text><text x="88" y="1022" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b">Non-claim: this experiment ran locally, not on Google Cloud; no cloud runtime, receipt, protected target or observer exists in it</text></svg>
