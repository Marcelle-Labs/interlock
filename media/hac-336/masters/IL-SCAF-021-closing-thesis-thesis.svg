<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="board-title board-desc"><title id="board-title">IL-SCAF-021 Valid alone does not mean safe together. - thesis</title><desc id="board-desc">CLOSE. Frozen evidence: 140 &gt; 130  120 &lt;= 130  140 &gt; 130 Non-claim: no safety, security, verification or production-readiness guarantee is claimed</desc><rect x="0" y="0" width="1920" height="1080" fill="#fbfbfa"/><text x="88" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#737b7b" letter-spacing="3">CLOSE</text><text x="1832" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#737b7b" text-anchor="end" letter-spacing="2">IL-SCAF-021</text><line x1="88" y1="116" x2="1832" y2="116" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="184" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="50" font-weight="600" fill="#0b0d0e" letter-spacing="-0.8">Valid alone does not mean safe together.</text><text x="88" y="360" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="54" font-weight="600" fill="#0b0d0e">Interlock reads revision-bound evidence about the composition</text><text x="88" y="427.5" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="54" font-weight="600" fill="#0b0d0e">before the mutation.</text><line x1="88" y1="540" x2="1832" y2="540" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="620" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="40" font-weight="600" fill="#0f919c">Parallel</text><text x="88" y="668" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="400" fill="#737b7b">when the evidence supports the composition.</text><text x="1028" y="620" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="40" font-weight="600" fill="#c35045">Serialized</text><text x="1028" y="668" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="26" font-weight="400" fill="#737b7b">when it does not.</text><text x="88" y="830" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="27" font-weight="400" fill="#0b0d0e">The evidence is load-bearing: remove it and the decision reverses.</text><line x1="88" y1="962" x2="1832" y2="962" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="996" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b">Frozen evidence: 140 &gt; 130  120 &lt;= 130  140 &gt; 130</text><text x="88" y="1022" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b">Non-claim: no safety, security, verification or production-readiness guarantee is claimed</text></svg>
