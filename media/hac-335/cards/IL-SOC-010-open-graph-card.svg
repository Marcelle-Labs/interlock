<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="card-title card-desc"><title id="card-title">IL-SOC-010 Interlock open-graph card</title><desc id="card-desc">Interlock. Evidence-bound coordination before shared-state mutation. Without Interlock 140 is greater than 130; with Interlock 120 is within 130. Controlled local experiment HAC-330.</desc><rect x="0" y="0" width="1200" height="630" fill="#fbfbfa"/><svg x="80" y="72" width="260" height="65.6842105263158" viewBox="0 0 190 48" fill="#0b0d0e" overflow="visible"><title>Interlock</title><g id="interlock-symbol" transform="translate(-2.889 0)"><path d="M2.889 6 L9.111 6 L17.2 14.089 L17.2 20.311 Z"></path><path d="M45.111 6 L38.889 6 L30.8 14.089 L30.8 20.311 Z"></path><path d="M2.889 42 L9.111 42 L17.2 33.911 L17.2 27.689 Z"></path><path d="M45.111 42 L38.889 42 L30.8 33.911 L30.8 27.689 Z"></path><path d="M18.6 16.2 L23.2 19.4 L23.2 28.6 L18.6 31.8 Z"></path><path d="M29.4 16.2 L24.8 19.4 L24.8 28.6 L29.4 31.8 Z"></path></g><text x="56" y="36" font-family="Geist, &#39;Geist Sans&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-1" fill="#0b0d0e">Interlock</text></svg><line x1="80" y1="192" x2="1120" y2="192" stroke="#c2c7c7" stroke-width="1"/><text x="80" y="268" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="46" font-weight="600" fill="#0b0d0e" letter-spacing="-0.8">Evidence-bound coordination</text><text x="80" y="322" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="46" font-weight="600" fill="#0b0d0e" letter-spacing="-0.8">before shared-state mutation.</text><text x="80" y="404" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b" letter-spacing="2.4">WITHOUT INTERLOCK</text><text x="80" y="462" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="52" font-weight="400" fill="#a4133c">140 &gt; 130</text><text x="640" y="404" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b" letter-spacing="2.4">WITH INTERLOCK</text><text x="640" y="462" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="52" font-weight="400" fill="#0f7d86">120 &lt;= 130</text><text x="80" y="540" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#737b7b" letter-spacing="2">CONTROLLED LOCAL EXPERIMENT · HAC-330</text></svg>
