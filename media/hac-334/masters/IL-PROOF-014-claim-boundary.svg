-size="17" font-weight="600" fill="#a21829">x</text><text x="1103.2" y="621.14" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">HAC-316 is failed/pivoted provenance and</text><text x="1103.2" y="644.6" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">is not a passing proof packet</text><text x="1083.2" y="679.06" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1103.2" y="679.06" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">WITHHOLD_SERIALIZE is not human</text><text x="1103.2" y="702.52" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">approval, joint authorization or certification</text><text x="1083.2" y="736.98" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1103.2" y="736.98" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">ALLOW plus receipt is not an</text><text x="1103.2" y="760.44" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">AUTHORIZED lifecycle state; no HAC-317</text><text x="1103.2" y="783.9" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">lifecycle vocabulary is imported</text><text x="1458.6" y="344" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1478.6" y="344" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">no exactly-once, restart-safety or recovery</text><text x="1478.6" y="367.46" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">guarantee is claimed (HAC-327 out of</text><text x="1478.6" y="390.92" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">scope)</text><text x="1458.6" y="425.38" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1478.6" y="425.38" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">no safety, security, verification or</text><text x="1478.6" y="448.84" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">production-readiness guarantee is claimed</text><text x="1458.6" y="483.3" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1478.6" y="483.3" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">three cloud negative controls are three</text><text x="1478.6" y="506.76" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">controls, not comprehensive attack</text><text x="1478.6" y="530.22" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">coverage</text><text x="1458.6" y="564.68" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1478.6" y="564.68" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">internal Interlock roles are not</text><text x="1478.6" y="588.14" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">Google-managed identities</text><text x="88" y="928" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="23" font-weight="400" fill="#737b7b">Two runs, two proof classes. Neither is evidence for the other.</text><line x1="88" y1="962" x2="1832" y2="962" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="996" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b">Frozen evidence: two proof classes, recorded separately</text><text x="88" y="1022" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#737b7b">Non-claim: no claim crosses between the two runs</text></svg>
