<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="board-title board-desc"><title id="board-title">IL-PROOF-014 Claim boundary</title><desc id="board-desc">CONTROLLED LOCAL EXPERIMENT and GOOGLE CLOUD PARTICIPATION, labelled separately. Frozen evidence: two proof classes, recorded separately Non-claim: no claim crosses between the two runs</desc><rect x="0" y="0" width="1920" height="1080" fill="#fbfbfa"/><text x="88" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#737b7b" letter-spacing="3">CONTROLLED LOCAL EXPERIMENT and GOOGLE CLOUD PARTICIPATION, labelled separately</text><text x="1832" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#737b7b" text-anchor="end" letter-spacing="2">IL-PROOF-014</text><line x1="88" y1="116" x2="1832" y2="116" stroke="#c2c7c7" stroke-width="1" stroke-linecap="butt"/><text x="88" y="184" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="50" font-weight="600" fill="#0b0d0e" letter-spacing="-0.8">Claim boundary</text><rect x="88" y="246" width="453.6" height="636" fill="none" stroke="#c2c7c7" stroke-width="1"/><text x="112" y="294" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" font-weight="600" fill="#0b0d0e">CONTROLLED LOCAL</text><text x="112" y="324" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" font-weight="600" fill="#0b0d0e">EXPERIMENT</text><text x="112" y="360" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="400" fill="#737b7b" letter-spacing="1.6">HAC-330</text><text x="112" y="408" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#737b7b">-</text><text x="132" y="408" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">A bounded causal experiment: revision-bound</text><text x="132" y="431.46" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">environment evidence changes the coordination</text><text x="132" y="454.92" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">decision and the joint outcome.</text><rect x="573.6" y="246" width="453.6" height="636" fill="none" stroke="#c2c7c7" stroke-width="1"/><text x="597.6" y="294" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" font-weight="600" fill="#0b0d0e">GOOGLE CLOUD</text><text x="597.6" y="324" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" font-weight="600" fill="#0b0d0e">PARTICIPATION</text><text x="597.6" y="360" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="400" fill="#737b7b" letter-spacing="1.6">HAC-340</text><text x="597.6" y="408" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#737b7b">-</text><text x="617.6" y="408" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">One recorded Gemini + Google ADK + Cloud Run</text><text x="617.6" y="431.46" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">traversal through Interlock.</text><text x="597.6" y="465.92" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#737b7b">-</text><text x="617.6" y="465.92" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">A receipt-bound protected mutation, independently</text><text x="617.6" y="489.38" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">read back, correlated in Cloud Logging.</text><text x="597.6" y="523.84" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#737b7b">-</text><text x="617.6" y="523.84" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#0b0d0e">Three recorded fail-closed refusals.</text><rect x="1059.2" y="246" width="772.8" height="636" fill="none" stroke="#0b0d0e" stroke-width="2"/><text x="1083.2" y="294" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="25" font-weight="600" fill="#0b0d0e">NOT CLAIMED</text><text x="1083.2" y="344" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1103.2" y="344" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">HAC-330 did not run on Google Cloud</text><text x="1083.2" y="378.46" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#a21829">x</text><text x="1103.2" y="378.46" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">HAC-340 does not reproduce the 140/120</text><text x="1103.2" y="401.92" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="17" font-weight="400" fill="#737b7b">counterfactual</text><