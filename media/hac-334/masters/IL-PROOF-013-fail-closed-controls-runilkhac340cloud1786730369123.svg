<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="board-title board-desc"><title id="board-title">IL-PROOF-013 Fail-closed / anti-bypass panel</title><desc id="board-desc">GOOGLE CLOUD PARTICIPATION. Frozen evidence: 403  401  403 Non-claim: not secure, not unbypassable, not comprehensive attack coverage; three recorded controls only</desc><rect x="0" y="0" width="1920" height="1080" fill="#0b0d0e"/><text x="88" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#9ba2a2" letter-spacing="3">GOOGLE CLOUD PARTICIPATION</text><text x="1832" y="90" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="500" fill="#9ba2a2" text-anchor="end" letter-spacing="2">IL-PROOF-013</text><line x1="88" y1="116" x2="1832" y2="116" stroke="#343a3a" stroke-width="1" stroke-linecap="butt"/><text x="88" y="184" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="50" font-weight="600" fill="#f2f3f2" letter-spacing="-0.8">Fail-closed / anti-bypass panel</text><line x1="88" y1="262" x2="1832" y2="262" stroke="#343a3a" stroke-width="1" stroke-linecap="butt"/><path d="M104.8 309 L104.8 341" fill="none" stroke="#f47d67" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="miter"/><path d="M119.2 309 L119.2 341" fill="none" stroke="#f47d67" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="miter"/><text x="160" y="320" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="31" font-weight="500" fill="#f2f3f2">Forged identity header</text><text x="160" y="354" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#9ba2a2">forged-header</text><text x="1832" y="342" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="70" font-weight="600" fill="#f47d67" text-anchor="end">403</text><line x1="88" y1="388" x2="1832" y2="388" stroke="#343a3a" stroke-width="1" stroke-linecap="butt"/><path d="M104.8 435 L104.8 467" fill="none" stroke="#f47d67" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="miter"/><path d="M119.2 435 L119.2 467" fill="none" stroke="#f47d67" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="miter"/><text x="160" y="446" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="31" font-weight="500" fill="#f2f3f2">Invalid bearer token</text><text x="160" y="480" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#9ba2a2">invalid-token</text><text x="1832" y="468" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="70" font-weight="600" fill="#f47d67" text-anchor="end">401</text><line x1="88" y1="514" x2="1832" y2="514" stroke="#343a3a" stroke-width="1" stroke-linecap="butt"/><path d="M104.8 561 L104.8 593" fill="none" stroke="#f47d67" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="miter"/><path d="M119.2 561 L119.2 593" fill="none" stroke="#f47d67" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="miter"/><text x="160" y="572" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="31" font-weight="500" fill="#f2f3f2">Direct target bypass without receipt</text><text x="160" y="606" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18" font-weight="400" fill="#9ba2a2">direct-bypass</text><text x="1832" y="594" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="70" font-weight="600" fill="#f47d67" text-anchor="end">403</text><line x1="88" y1="640" x2="1832" y2="640" stroke="#343a3a" stroke-width="1" stroke-linecap="butt"/><text x="88" y="680" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" fill="#9ba2a2">Three recorded refusals. Not a security claim.</text><rect x="88" y="724" width="1744" height="150" fill="none" stroke="#f2f3f2" stroke-width="1" stroke-dasharray="3 3"/><text x="112" y="760" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" font-weight="500" fill="#9ba2a2" letter-spacing="2.2">CONTROLLED LOCAL PARITY  --  NOT A CLOUD RESULT</text><text x="112" y="794" font-family="Helvetica, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" fill="#9ba2a2">The frozen field is named wrongAudienceStatus; the control sent an invalid token. Genuine wrong-audience rejection is controlled local parity, not a cloud result.</text><line x1="88" y1="962" x2="1832" y2="962" stroke="#343a3a" stroke-width="1" stroke-linecap="butt"/><text x="88" y="996" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#9ba2a2">Frozen evidence: 403  401  403</text><text x="88" y="1022" font-family="Courier, 'Courier New', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#9ba2a2">Non-claim: not secure, not unbypassable, not comprehensive attack coverage; three recorded controls only</text></svg>
