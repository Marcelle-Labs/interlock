name: CI

on:
  pull_request:
  push:
    branches: [main]

# Deterministic by construction: pinned runner image, pinned Node, no network
# dependency beyond the checkout and a frozen lockfile, and no step that can
# pass by being skipped.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded push to a branch has nothing left to prove. `main` is excluded
  # from cancellation so the record of what actually landed stays complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  provenance:
    name: Provenance boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      # No dependency install: check-provenance.mjs uses only Node builtins, so
      # this job stays fast and cannot be broken by a registry outage.
      - name: Check provenance boundary
        run: npm run check:provenance

      - name: Required authority files are present
        run: |
          set -euo pipefail
          missing=0
          for f in AGENTS.md CLAUDE.md DISCLOSURE.md \
                   provenance/manifest.json provenance/manifest.schema.json \
                   docs/development/workspace.md; do
            if [ ! -f "$f" ]; then
              echo "missing required file: $f"
              missing=1
            fi
          done
          exit "$missing"

      - name: Source files are text
        run: |
          set -euo pipefail
          # `git grep` silently skips files it considers binary, so one stray
          # control byte in a source file would quietly exempt that file from
          # the spelling check below and from every future repository-wide scan.
          # A check that did not run is not a pass.
          #
          # Not hypothetical: during HAC-330 a NUL byte in a template literal
          # made a .mjs file read as binary, and `git grep` stopped seeing it.
          # It happened again in HAC-326, in a .ts file — which this check did
          # not cover, so it caught nothing. `*.ts` is included for exactly that
          # reason: the rule was not wrong, it was scoped to the one language
          # that had already tripped it.
          # `sort -u`: git lists a path once per stage while a merge is
          # unresolved, which would otherwise report a perfectly good file as
          # binary purely because it appears more than once.
          all=$(git ls-files -- '*.mjs' '*.js' '*.ts' '*.json' '*.md' | sort -u)
          text=$(git grep -lI -e '' -- '*.mjs' '*.js' '*.ts' '*.json' '*.md' | sort -u)
          binary=$(comm -23 <(echo "$all") <(echo "$text") || true)
          if [ -n "$binary" ]; then
            echo "Source files git treats as binary; repository-wide scans skip them:"
            echo "$binary"
            exit 1
          fi
          echo "All source files are text"

      - name: Canonical product spelling
        run: |
          set -euo pipefail
          # HAC-328 fixes "Interlock" as the canonical name. Catch the
          # misspellings before they reach the submission.
          #
          # The three excluded paths are the ones that *define* the rule, so
          # they must name the forbidden spellings in order to forbid them.
          # Excluding anything else means a real misspelling shipped.
          if git grep -nEi 'interlok|interloc([^k]|$)' -- \
               ':!.github/workflows/ci.yml' \
               ':!AGENTS.md' \
               ':!scripts/check-provenance.mjs' > /tmp/hits 2>/dev/null; then
            echo "Non-canonical product spelling found. Use 'Interlock'."
            cat /tmp/hits
            exit 1
          fi
          echo "Canonical spelling OK"

  # Build, typecheck and deterministic tests. Reported as the `test` context.
  #
  # Single Node version on purpose: `engines` declares `>=22.0.0` and this
  # repository pins `22.19.0`, so a matrix over 20 and 22 — the convention in the
  # workspacejson repositories — would be testing a runtime this package does not
  # claim to support. The check name is kept free of a version so that bumping
  # the pinned patch release does not silently rename a required status context.
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      # Full history, not the default depth-1 clone. HAC-343 froze three
      # contracts before any arm produced a result, and
      # experiments/hac-343/bin/verify-packet.mjs proves that by resolving each
      # freeze commit and comparing the bytes on disk to the blob that commit
      # recorded. A shallow checkout has neither the commits nor the blobs, so
      # the verifier fails with `path exists on disk, but not in <sha>` and
      # test/hac-343-check-wiring.test.mjs fails with it. Measured: exit 1 at
      # depth 1, exit 0 with full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned for the same reason as codecov-action below: a third-party action
      # on a mutable tag. Sonar did not flag this one only because it is not new
      # code on this pull request, and "the analyzer did not mention it" is not
      # evidence that it is safe.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      # `--frozen-lockfile` is what makes this job deterministic: a lockfile that
      # does not match the manifest fails here rather than silently resolving to
      # a different dependency set than the one that was reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck before build and test. A type error is the cheapest failure to
      # read, so it should not be buried under a test report.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test with coverage
        run: pnpm run test:coverage

      # Coverage is produced here but adjudicated by Codecov, not by this job.
      # Uploading it as an artifact keeps the evidence attached to the run even
      # when the external service is unavailable.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

      # META-337 §7: failure output must be agent-actionable. An implementation
      # agent reading only this summary should learn what the gate asserts, who
      # owns it, what discharges it, and what it must not do to turn it green.
      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## CI failed: build, typecheck or tests"
            echo
            echo "**Invariant.** \`main\` builds, typechecks, and passes its tests"
            echo "deterministically on the pinned Node version."
            echo
            echo "**Why it matters.** This is the only gate in the set that proves the"
            echo "code runs at all. Every other signal — coverage, new-code quality,"
            echo "provenance — is interpreting a build that this job already established"
            echo "was sound. If this is red, the others are not meaningful."
            echo
            echo "**Authority.** Repository CI (\`.github/workflows/ci.yml\`), reported by"
            echo "the \`github-actions\` app as \`test\`. No external service can discharge"
            echo "or override it."
            echo
            echo "**Evidence required.** A passing \`pnpm run typecheck\`,"
            echo "\`pnpm run build\`, and \`pnpm run test:coverage\` on this exact head."
            echo "Reproduce locally with those three commands before pushing again."
            echo
            echo "**Do not weaken.** Do not delete or \`skip\` the failing test, loosen a"
            echo "\`tsconfig\` strictness flag, or add \`continue-on-error\` to recover"
            echo "green. If the assertion is wrong, say so in the PR and change it"
            echo "deliberately — that is a reviewable decision, not a CI fix."
          } >> "$GITHUB_STEP_SUMMARY"

  # Delivery of the coverage report to Codecov, as its own job on purpose.
  #
  # Uploading inside `test` would mean a Codecov outage turns the build/typecheck/
  # test context red, which conflates two different failure classes and teaches
  # everyone to distrust the one gate that must stay trustworthy. Split out, the
  # ownership is unambiguous:
  #
  #   test            -> the code builds and its tests pass
  #   Coverage upload -> the evidence reached the adjudicator
  #   codecov/patch   -> the evidence is good enough (Codecov's call, see codecov.yml)
  coverage:
    name: Coverage upload
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      # `fail_ci_if_error` is the whole point. A silently dropped upload leaves
      # Codecov with nothing to adjudicate, and a patch status that never arrives
      # is indistinguishable from one that passed. Missing is not green.
      # Pinned to a commit SHA, not the `v5` tag. A tag is mutable: whoever
      # controls the action's repository can repoint it, and this step handles
      # our coverage data with a job token. SonarCloud flagged the tag form as
      # githubactions:S7637 on the pull request that introduced it, which is the
      # gate doing its job — the fix is to pin, not to exclude the rule.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Coverage upload failed"
            echo
            echo "**Invariant.** Every run that produces coverage delivers it to the"
            echo "adjudicator."
            echo
            echo "**Why it matters.** Codecov cannot fail a patch it never received. If"
            echo "this job is allowed to fail quietly, \`codecov/patch\` simply never"
            echo "reports, and a pull request with no test coverage at all looks exactly"
            echo "like one that passed. Missing is not green."
            echo
            echo "**Authority.** Repository CI, reported by \`github-actions\` as"
            echo "\`Coverage upload\`. It asserts delivery only — whether the coverage is"
            echo "*adequate* is \`codecov/patch\`'s call, configured in \`codecov.yml\`."
            echo
            echo "**Evidence required.** A successful upload of \`coverage/lcov.info\` for"
            echo "this head. If Codecov is genuinely down, wait and re-run: an outage is"
            echo "a reason to retry, not a reason to merge without coverage."
            echo
            echo "**Do not weaken.** Do not set \`fail_ci_if_error: false\`, do not add"
            echo "\`continue-on-error\`, and do not drop this job to recover green."
          } >> "$GITHUB_STEP_SUMMARY"

  # Integrity of the committed HAC-330 evidence packet.
  #
  # A distinct failure class from `test`, and deliberately a separate job: `test`
  # owns "does the code run", this owns "does the recorded evidence still say
  # what the packet claims". The decision-function tests themselves run under
  # `test`, with the rest of the suite, because this repository has one test
  # runner and adding a second would fork that ownership.
  #
  # What a green tick here does and does not mean:
  #
  # It DOES prove the packet is internally consistent — every recorded digest is
  # the digest of the committed artifact, and every recorded decision re-derives
  # by running the real decision function over the recorded evidence. An edited
  # artifact, an edited digest or an edited claim fails here.
  #
  # It does NOT prove the artifacts came from the pinned miner. `workspacejson/cli`
  # is not checked out on this runner and must not be cloned by CI — that would
  # make a merge gate depend on another repository's availability. Re-mining is
  # the local gate, `pnpm run hac330`, which refuses to run against a drifted or
  # dirty checkout.
  #
  # Not a required context. Promoting it is a branch-protection change owned by
  # META-337.
  concept-gate:
    name: S-1 concept gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      # No dependency install: verify-packet.mjs uses only Node builtins.
      - name: Verify the HAC-330 evidence packet
        run: npm run check:packet

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## S-1 evidence packet does not verify"
            echo
            echo "**Invariant.** Every digest, revision and decision recorded in"
            echo "\`experiments/hac-330/evidence/results.json\` matches the committed"
            echo "artifacts, and the recorded decisions re-derive from the recorded"
            echo "evidence through the real decision function."
            echo
            echo "**Why it matters.** The HAC-330 packet is the evidence that S-1 passed."
            echo "If an artifact, a digest or a claim can be edited without anything"
            echo "failing, the packet proves nothing."
            echo
            echo "**Authority.** Repository CI, reported as \`S-1 concept gate\`."
            echo
            echo "**Evidence required.** Re-run the experiment against the pinned"
            echo "\`workspacejson/cli\` checkout with \`pnpm run hac330\`, which"
            echo "regenerates the packet, then \`pnpm run check:packet\`."
            echo
            echo "**Do not weaken.** Do not hand-edit an artifact or a recorded digest to"
            echo "make this pass. Regenerate the packet from a real mining run, or record"
            echo "on HAC-330 why the experiment no longer holds."
          } >> "$GITHUB_STEP_SUMMARY"

  # Integrity of the committed HAC-326 evidence packet, and a live re-run of the
  # local enforcement experiment.
  #
  # Two steps, two different claims, deliberately not merged:
  #
  #   verify-packet  -> the committed evidence still says what the receipt claims
  #   run-experiment -> the enforcement path still behaves that way on this commit
  #
  # The second is possible here — unlike the S-1 gate, which needs a sibling
  # checkout — because the local arm depends on nothing outside this repository.
  # The Cloud Run arm is NOT re-run: it executed against a disposable project
  # that has been deleted, and a merge gate must not depend on live cloud spend.
  #
  # Not a required context. Promoting it is a branch-protection change owned by
  # META-337.
  s2-enforcement-gate:
    name: S2 enforcement gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      # `--ignore-scripts`: a dependency lifecycle script runs arbitrary code in
      # the job, and this one only needs TypeScript to compile and Node to run
      # the experiment. Nothing it installs has a legitimate postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the committed HAC-326 evidence packet
        run: pnpm run check:packet:s2

      - name: Re-run the local enforcement experiment
        run: pnpm run hac326

      - name: The re-run still passes every check
        run: |
          set -euo pipefail
          # `pnpm run hac326` already exits non-zero on failure. This asserts the
          # recorded verdict independently, so a runner that swallowed the exit
          # code cannot pass this job with a FAIL packet on disk.
          node -e '
            const results = require("./experiments/hac-326/evidence/results.json");
            if (results.result !== "PASS") {
              console.error(`re-run recorded ${results.result}`);
              process.exit(1);
            }
            const failed = results.checks.filter((check) => !check.passed);
            if (failed.length > 0) {
              console.error(`failed checks: ${failed.map((c) => c.id).join(", ")}`);
              process.exit(1);
            }
            console.log(`re-run PASS, ${results.checks.length} checks`);
          '

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## S2 enforcement gate failed"
            echo
            echo "**Invariant.** The bounded Interlock proxy denies an unsafe composed pair"
            echo "before the protected mutation, the protected target refuses every receipt"
            echo "that is absent, stale, replayed, expired, or bound to another"
            echo "intent/target/revision, and every failure mode fails closed."
            echo
            echo "**Why it matters.** This is the architecture-freeze evidence from HAC-326."
            echo "HAC-325 already falsified the preferred Agent Gateway insertion point; if"
            echo "this gate goes red, the fallback insertion point is no longer proven"
            echo "either, and HAC-316/HAC-317 are building on an unproven contract."
            echo
            echo "**Authority.** Repository CI, reported as \`S2 enforcement gate\`."
            echo
            echo "**Evidence required.** \`pnpm run hac326\` passing on this commit, and"
            echo "\`pnpm run check:packet:s2\` verifying the committed packet."
            echo
            echo "**Do not weaken.** Do not hand-edit an evidence artifact, do not relax a"
            echo "rejection assertion, and do not delete a chaos arm to recover green. If an"
            echo "enforcement property genuinely changed, that is an architecture change and"
            echo "belongs on HAC-326 as a recorded finding."
          } >> "$GITHUB_STEP_SUMMARY"

  evidence-publication-gate:
    name: Evidence publication gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Public verification only. Regenerating the packet needs the frozen
      # source, which is deliberately not in public history, so this asserts the
      # published bytes rather than reproducing them. Determinism is a local
      # gate, run where that source exists.
      - name: Verify the published judge-safe packet
        run: pnpm run check:packet:public

      - name: No private evidence reached public history
        run: |
          set -euo pipefail
          # The unredacted packet must never appear here, by path or by content.
          if [ -e experiments/hac-340/evidence/cloud-run.json ]; then
            echo "the unredacted HAC-340 packet is present in public history"
            exit 1
          fi
          # Scoped to what HAC-342 publishes, and matched structurally. Naming a
          # literal identifier here would put it in public history to look for it.
          if git grep -qIE '[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com' -- experiments/hac-342 ; then
            echo "a service account email is present in the published evidence"
            exit 1
          fi
          if git grep -qIE 'https://[a-z0-9-]+-[a-z0-9]{10}-uc\.a\.run\.app' -- experiments/hac-342 ; then
            echo "a Cloud Run deployment endpoint is present in the published evidence"
            exit 1
          fi
          if git grep -qIE 'projects/[a-z0-9_-]+/logs' -- experiments/hac-342 ; then
            echo "a project-scoped log name is present in the published evidence"
            exit 1
          fi
          echo "no private evidence found in the published evidence"

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Evidence publication gate failed"
            echo
            echo "**Invariant.** The judge-safe packet published by HAC-342 is a redacted"
            echo "derivative of a frozen HAC-340 packet that is deliberately NOT public."
            echo "\`publicPacketSha256\` verifies the published bytes and is the digest a"
            echo "reader can check. \`sourcePacketSha256\` is a commitment to the private"
            echo "source and is never presented as reader-recomputable. They are never"
            echo "equal. Every material evidence field survives redaction unredacted, and"
            echo "the principal relations that carry transport provenance and observer"
            echo "independence are asserted rather than assumed."
            echo
            echo "**Why it matters.** A judge checks this packet without repository access."
            echo "A digest that names bytes it does not hash, a redaction that deletes the"
            echo "receipt digest instead of an identifier, or a reintroduced project id,"
            echo "endpoint or service-account local part each break the publication rather"
            echo "than the build."
            echo
            echo "**Authority.** Repository CI, reported as \`Evidence publication gate\`."
            echo
            echo "**Evidence required.** \`pnpm run check:packet:public\` passing on this"
            echo "commit, and no private evidence reachable from public history."
            echo
            echo "**Do not weaken.** Do not hand-edit the public packet or its manifest, do"
            echo "not relax a material-field or principal-relation assertion to accommodate"
            echo "a redaction, and do not add the frozen packet to public history to make"
            echo "regeneration work. If a material field genuinely must be redacted, that is"
            echo "a claim change and belongs on HAC-342 as a recorded finding."
          } >> "$GITHUB_STEP_SUMMARY"

  storyboard-contract-gate:
    name: Storyboard contract gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the 30-second storyboard contract
        run: pnpm run check:storyboard

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Storyboard contract gate failed"
            echo
            echo "**Invariant.** The muted 30-second cut runs exactly 30.00 s across nine"
            echo "contiguous scenes; proof class A completes before SB-06 resets the context"
            echo "and proof class B begins after it; no scene presents HAC-330 and HAC-340 as"
            echo "one run; every scene keeps a static and reduced-motion equivalent and a"
            echo "hold/capture state; and no lifecycle state appears that a frozen packet"
            echo "does not emit."
            echo
            echo "**Why it matters.** This storyboard is the motion and capture contract that"
            echo "HAC-341, HAC-324 and HAC-336 consume. A drift here becomes a false claim in"
            echo "the judge-facing video, where it is far more expensive to catch."
            echo
            echo "**Authority.** Repository CI, reported as \`Storyboard contract gate\`."
            echo
            echo "**Evidence required.** \`pnpm run check:storyboard\` passing on this commit."
            echo
            echo "**Do not weaken.** Do not retime a scene to reach 30.00 without re-deriving"
            echo "the story, do not relax the proof-class separation to fit a transition, and"
            echo "do not delete a non-claim to silence a vocabulary check. If the evidence"
            echo "genuinely changed, that is a claim change and belongs on HAC-333."
          } >> "$GITHUB_STEP_SUMMARY"

  evaluation-gate:
    name: Evaluation gate
    runs-on: ubuntu-24.04
    steps:
      # Full history, not the default depth-1 clone. HAC-343 froze three
      # contracts before any arm produced a result, and the verifier proves
      # that by resolving each freeze commit and comparing the bytes on disk
      # to the blob that commit recorded. A shallow checkout has neither the
      # commits nor the blobs: the verifier fails with `path exists on disk,
      # but not in <sha>`. Measured: exit 1 at depth 1, exit 0 with history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `check:packet:eval` builds first: alone among the packet verifiers,
      # experiments/hac-343/lib/arms.mjs loads the compiled decision core from
      # dist/, because the experiment measures the real arbitrate() rather than
      # a reimplementation of it.
      - name: Verify the HAC-343 evaluation packet
        run: pnpm run check:packet:eval

      # The seam, in both directions: an invalid packet must fail this gate,
      # and a HAC-343 field moving underneath the committed view model must
      # fail the cockpit gate.
      - name: The cockpit's HAC-343 bindings fail when the packet moves
        run: pnpm vitest run test/hac-343-check-wiring.test.mjs

      # `judge-export.json` is a *derived* presentation artifact: the verifier
      # above recomputes the report from the raw records, but it never rebuilt
      # the export. Ten judge-facing values reach the comparison panel through
      # that file alone — all four strategy labels, the per-target-lock
      # credibility figure, and the canonical result commit — so a hand edit
      # there reached a judge with every gate green.
      #
      # Rebuild and assertion are two steps on purpose. An enforcement step's
      # `run` must be exactly one expected command, because a multi-line body is
      # a shell script and no amount of reading it tells you which lines
      # actually execute: `if false; then`, a heredoc and an open quote all put
      # a command at the start of a line without running it. One command per
      # step is a shape that can be checked instead of inferred.
      - name: Rebuild the derived judge export
        run: node experiments/hac-343/bin/build-judge-export.mjs

      - name: The judge export is byte-identical to its rebuild
        run: git diff --exit-code -- experiments/hac-343/evidence/judge-export.json

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Evaluation gate failed"
            echo
            echo "**Invariant.** Every metric in \`experiments/hac-343/evidence/results.json\`"
            echo "is recomputed from the raw records rather than read back from the summary,"
            echo "and the three contracts frozen before the run — metric definitions, corpus"
            echo "and execution semantics — are still byte-identical to the blobs their freeze"
            echo "commits recorded."
            echo
            echo "**Why it matters.** The judge cockpit binds twenty-four comparison cells"
            echo "into this packet. A packet that no longer verifies is a packet whose numbers"
            echo "a judge is nonetheless reading, and \"frozen before results\" stops being"
            echo "checkable by anyone who was not there."
            echo
            echo "**Authority.** Repository CI, reported as \`Evaluation gate\`."
            echo
            echo "**Evidence required.** \`pnpm run check:packet:eval\` passing on this commit,"
            echo "and \`test/hac-343-check-wiring.test.mjs\` green."
            echo
            echo "**Do not weaken.** Do not re-freeze a contract to match an edit, do not read"
            echo "a metric out of the summary to make the recomputation agree, and do not drop"
            echo "\`fetch-depth: 0\` to make the freeze-commit checks stop resolving. If the"
            echo "experiment genuinely changed, it is a new run, not an edited one."
          } >> "$GITHUB_STEP_SUMMARY"

  cockpit-contract-gate:
    name: Cockpit contract gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the cockpit contract
        run: pnpm run check:cockpit

      - name: The view model is derived, not hand-edited
        run: |
          set -euo pipefail
          # Rebuilding from frozen evidence must reproduce the committed bytes.
          # If it does not, the view model was edited by hand and no longer
          # describes the evidence it claims to.
          cp media/hac-341/evidence/view-model.json /tmp/committed-view-model.json
          pnpm run cockpit:build
          diff -u /tmp/committed-view-model.json media/hac-341/evidence/view-model.json

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Cockpit contract gate failed"
            echo
            echo "**Invariant.** The two proof classes stay separate objects. HAC-330 has no"
            echo "receipt, effect, observation or cloud provenance; HAC-340 has no arms and no"
            echo "bounded joint outcome. Every displayed value is derived from frozen evidence,"
            echo "\`EXECUTED\` and \`OBSERVED\` never collapse, evidence links pin to immutable"
            echo "commits, \`runtimeSourceUrl\` stays unavailable, and an unknown run renders"
            echo "\`run.missing\` rather than the canonical run."
            echo
            echo "**Why it matters.** A judge reads this surface to decide whether the claims"
            echo "are real. A field borrowed across proof classes produces a synthetic run that"
            echo "never happened, which is the most expensive possible defect here."
            echo
            echo "**Authority.** Repository CI, reported as \`Cockpit contract gate\`."
            echo
            echo "**Evidence required.** \`pnpm run check:cockpit\` passing, and"
            echo "\`pnpm run cockpit:build\` reproducing the committed view model."
            echo
            echo "**Do not weaken.** Do not hand-edit the view model, do not add a field to one"
            echo "run because the other has it, and do not relax a link check to ship a branch"
            echo "URL. If the evidence changed, rebuild from it."
          } >> "$GITHUB_STEP_SUMMARY"

  cockpit-visual-contract-gate:
    name: Cockpit visual contract gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Browser tooling is intentionally external to the repository package:
      # deterministic evidence gates must still install without a browser.
      - name: Install pinned browser runner
        run: |
          set -euo pipefail
          # The browser binary is installed explicitly below. Do not give an
          # arbitrary package lifecycle hook a chance to execute first.
          npm install --ignore-scripts --prefix /tmp/interlock-playwright playwright@1.56.1
          /tmp/interlock-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify rendered first-frame and drawer contracts
        env:
          PLAYWRIGHT_MODULE: /tmp/interlock-playwright/node_modules/playwright
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/interlock-cockpit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/media/hac-341/cockpit.html >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/media/hac-341/cockpit.html >/dev/null
          pnpm run check:cockpit:visual -- --base http://127.0.0.1:4173

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Cockpit visual contract gate failed"
            echo
            echo "**Invariant.** The real cockpit fits its required desktop first-frame"
            echo "regions with 48px headroom, does not create horizontal overflow, keeps"
            echo "the evidence drawer anchored and keyboard-correct, syntax-renders raw proof,"
            echo "and makes no off-origin requests. Mobile has its own intentional first-frame"
            echo "contract rather than pretending to fit the whole desktop review into a phone."
            echo
            echo "**Evidence required.** Run a repository-root server and then"
            echo "\`PLAYWRIGHT_MODULE=/path/to/playwright pnpm run check:cockpit:visual\`."
            echo "Repair the layout or interaction; do not lower the viewport, headroom, or"
            echo "required semantic regions merely to recover green."
          } >> "$GITHUB_STEP_SUMMARY"

  visual-suite-gate:
    name: Visual suite gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install dependencies
        # resvg-js resolves a prebuilt platform binary through optional
        # dependencies and has no install script, so the house --ignore-scripts
        # rule costs nothing here.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the visual contract
        run: pnpm run check:visuals

      - name: The model and the masters are derived, not hand-edited
        run: |
          set -euo pipefail
          # Rebuilding from frozen evidence must reproduce the committed bytes.
          # SVG and the visual model are deterministic string output, so they are
          # compared exactly. Rasters are not: font rasterisation differs between
          # hosts, so their correspondence is asserted by check:visuals through
          # the recorded master digest and the real pixel geometry instead.
          mkdir -p /tmp/committed-pdf
          cp -r media/hac-334/evidence /tmp/committed-evidence
          cp -r media/hac-334/masters /tmp/committed-masters
          cp media/hac-334/exports/*.pdf /tmp/committed-pdf/
          pnpm run visuals:build
          diff -ru /tmp/committed-evidence media/hac-334/evidence
          diff -ru /tmp/committed-masters media/hac-334/masters
          for f in /tmp/committed-pdf/*.pdf; do diff "$f" "media/hac-334/exports/$(basename "$f")"; done

      - name: Every gate is proven to fail on the defect it targets
        run: pnpm vitest run test/hac-334-gate-perturbation.test.mjs

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Visual suite gate failed"
            echo
            echo "**Invariant.** Every factual label on every board is derived from frozen"
            echo "evidence, and the two proof classes never merge. Class A carries the HAC-330"
            echo "counterfactual and no receipt, effect or observation; class B carries the"
            echo "HAC-340 traversal and no bounded joint outcome. No board renders a lifecycle"
            echo "state the packets do not emit, describes the observer as unable to authorize,"
            echo "names an unevidenced deployment revision, fabricates \`runtimeSourceUrl\`,"
            echo "links evidence through a mutable branch, or puts a quantitative mark on the"
            echo "HAC-319 shell. Every derivative corresponds to a current master."
            echo
            echo "**Why it matters.** These are the images a judge reads before any prose, and"
            echo "they are reused by HAC-335 and HAC-336. A number that drifts here is repeated"
            echo "into the README, the Devpost entry and the video, where it is far more"
            echo "expensive to retract than to prevent."
            echo
            echo "**Authority.** Repository CI, reported as \`Visual suite gate\`."
            echo
            echo "**Evidence required.** \`pnpm run check:visuals\` passing,"
            echo "\`pnpm run visuals:build\` reproducing the committed model and masters, and"
            echo "the perturbation suite proving each check still fails on its own defect."
            echo
            echo "**Do not weaken.** Do not hand-edit a master or the visual model, do not"
            echo "widen the forbidden-language allowlist to ship a phrase, and do not delete a"
            echo "non-claim to quiet a check. If a raster is reported stale, re-run"
            echo "\`pnpm run visuals:export\`; if the evidence genuinely changed, rebuild from it."
          } >> "$GITHUB_STEP_SUMMARY"

  identity-boundary-gate:
    name: Identity boundary gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the identity boundary
        run: pnpm run check:identity

      - name: Every identity gate is proven to fail on its own defect
        run: pnpm vitest run test/hac-341-identity-gates.test.mjs

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Identity boundary gate failed"
            echo
            echo "**Invariant.** The Interlock identity is repository-native and one"
            echo "authority. The canonical mark is drawn from the frozen geometry, never"
            echo "approximated in CSS; Geist and Geist Mono resolve from vendored local faces"
            echo "with recorded provenance and digests; no judge-facing surface reaches a font"
            echo "CDN to render; the cockpit and the storyboard resolve the same identity"
            echo "authority; and no manifest cites an identity asset the repository lacks."
            echo
            echo "**Why it matters.** This gate exists because all of that was false at once"
            echo "and nothing noticed: the cockpit drew the mark as a CSS rectangle, both"
            echo "surfaces named Geist and loaded no font, and the HAC-333 scene manifest"
            echo "cited a logo file that was never in the repository. A judge saw an"
            echo "engineering harness where the product should have been."
            echo
            echo "**Authority.** HAC-332 frozen identity; repository CI reports this as"
            echo "\`Identity boundary gate\`."
            echo
            echo "**Evidence required.** \`pnpm run check:identity\` passing, and the"
            echo "negative-proof suite showing each invariant still fails when violated."
            echo
            echo "**Do not weaken.** Do not re-approximate the mark, do not add a font CDN to"
            echo "recover a render, and do not silence a digest mismatch. A change to the mark"
            echo "is a change to the identity: record a new asset revision instead."
          } >> "$GITHUB_STEP_SUMMARY"

  judge-package-gate:
    name: Judge package gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the judge-facing package
        run: pnpm run check:package

      - name: Every package gate is proven to fail on its own defect
        run: pnpm vitest run test/hac-335-package-gates.test.mjs

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## Judge package gate failed"
            echo
            echo "**Invariant.** The judge-facing package says exactly what the frozen"
            echo "evidence supports, in an order that never presents a stronger claim than"
            echo "the first proof carries. The controlled local experiment (HAC-330) and"
            echo "Google Cloud participation (HAC-340) never merge into one purported run;"
            echo "\`AUTHORIZED\`, Agent Runtime and Agent Gateway never appear as evidenced"
            echo "participation; \`140\`, \`120\`, \`130\`, \`24/24\` and \`alpha=45\` are read out of"
            echo "the frozen records rather than typed into prose; every public evidence URL"
            echo "is commit-pinned and registered; \`runtimeSourceUrl\` is never fabricated and"
            echo "\`sourcePacketSha256\` is never described as reader-recomputable; HAC-319 is"
            echo "unbound and no metric is rendered; every asset is in the registry and every"
            echo "material claim is in the claim ledger."
            echo
            echo "**Why it matters.** This is a synthesis surface: it authors almost no facts"
            echo "and arranges facts other issues froze. That is exactly where a claim drifts"
            echo "one notch stronger than its evidence without anyone editing the evidence."
            echo "The gate binds prose to evidence in both directions, so changing either"
            echo "side alone fails."
            echo
            echo "**Authority.** HAC-335 issue contract; HAC-330, HAC-340 and HAC-342 own the"
            echo "facts; HAC-332 owns the export naming grammar."
            echo
            echo "**Evidence required.** \`pnpm run check:package\` passing, and the"
            echo "negative-proof suite showing each invariant still fails when violated."
            echo
            echo "**Do not weaken.** Do not delete a non-claim to quiet a check, do not"
            echo "replace an immutable evidence URL with a branch URL to keep a link alive,"
            echo "and do not widen the export-naming vocabulary. If a derivative is reported"
            echo "stale, re-run \`pnpm run package:build\`; if a capture is stale, re-run"
            echo "\`pnpm run package:capture\` against the merged cockpit."
          } >> "$GITHUB_STEP_SUMMARY"
